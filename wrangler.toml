# Cloudflare Workers project serving the site (docs/deploy.md). Cloudflare builds it from this
# repository: build command `npm run build`, deploy command `npx wrangler deploy`.
# Static assets are served as before; the Worker (worker/index.ts) only runs for /api/*, which
# is taLLMan's API (docs/tallman.md). _headers in dist/ sets response headers.
name = "anton-portfolio"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
# The site answers on anton-portfolio.anton-ernstson.workers.dev as well as its domain, and every
# pull request gets a preview URL there.
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# Where debate shards are read from (the R2 public bucket).
SHARD_BASE = "https://pub-9867b18896ba49e4a0b4a3d2f39c0385.r2.dev/"
# LLM_MODEL = "claude-opus-5-5"
# LLM_EFFORT = "medium"

# Secrets are set with `npx wrangler secret put <NAME>`, never here:
#   ANTHROPIC_API_KEY   the language model (without it, answers are extractive)
#   ADMIN_TOKEN         guards POST /api/tallman/reindex

# Embeddings and vector search. Uncomment after creating the index (docs/tallman.md):
#   npx wrangler vectorize create tallman --dimensions=1024 --metric=cosine
# [ai]
# binding = "AI"
#
# [[vectorize]]
# binding = "VECTORS"
# index_name = "tallman"

# A per-visitor limit on questions, so a public key cannot be run up:
# [[ratelimits]]
# name = "ASK_LIMITER"
# namespace_id = "1001"
# simple = { limit = 10, period = 60 }

# Branch previews (`npx wrangler preview`, run by Workers Builds for pull requests); empty is enough.
[previews]
