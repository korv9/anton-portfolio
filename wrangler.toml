# Cloudflare Workers project serving the site (docs/deploy.md). Cloudflare builds it from this
# repository: build command `npm run build`, deploy command `npx wrangler deploy`.
# The site is static files plus a Worker for /api/* (worker/index.ts, docs/workers-ai.md);
# _headers in dist/ sets the headers of the files, the Worker sets its own.
name = "anton-portfolio"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
# The site answers on anton-portfolio.anton-ernstson.workers.dev as well as its domain, and every
# pull request gets a preview URL there.
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
# "none": every miss reaches the Worker, which serves the app shell only for page addresses
# and a 404 for missing files (worker/index.ts asset()).
not_found_handling = "none"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

# Allegora's search over every Swedish law and ordinance in force (docs/allegora-gcp.md). Not a
# secret: the service answers only with ALLEGORA_SEARCH_KEY, a Cloudflare secret.
[vars]
ALLEGORA_SEARCH_URL = "https://allegora-search-877662270161.europe-west4.run.app"

# Allegora's daily question counts (worker/quota.ts): 10 per visitor, 200 for the site.
[[kv_namespaces]]
binding = "QUOTA"
id = "c6ad9f69839444deacf9c661e457ca30"

# Per visitor IP and Cloudflare location: 20 AI requests a minute. The daily neuron allocation
# stays the hard limit.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# The job assistant's owner records (worker/jobs.ts). The id (not a secret) is the one the workflow
# setup-job-assistant.yml printed (run 41710481305), which also applied worker/migrations.
[[d1_databases]]
binding = "JOBS_DB"
database_name = "job-assistant"
database_id = "03c29b31-deff-4fa5-876c-56b1fe70d109"
migrations_dir = "worker/migrations"

# Branch previews (`npx wrangler preview`, run by Workers Builds for pull requests); empty is enough.
[previews]
