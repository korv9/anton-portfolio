# Cloudflare Workers project serving the static site (docs/deploy.md). Cloudflare builds it from
# this repository: build command `npm run build`, deploy command `npx wrangler deploy`.
# There is no Worker script, only static assets; _headers in dist/ sets response headers.
name = "anton-portfolio"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
