name: portfolio
version: '1.0.0'
config-version: 2
profile: portfolio

model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]
macro-paths: [macros]
clean-targets: [target, dbt_packages]

flags:
  send_anonymous_usage_stats: false

# Medallion layers are schemas in the warehouse, not directories of files. Only bronze
# reads from disk; silver and gold are built and stay inside DuckDB until publish/
# exports the delivery artefacts.
models:
  portfolio:
    bronze:
      +materialized: view
      +schema: bronze
      philosophy:
        +tags: [philosophy]
      job_ai_governance:
        +tags: [job_ai_governance]
      ai_politics:
        +tags: [ai_politics]
      eu_ai_act:
        +tags: [ai_act]
      jobs:
        +tags: [jobs]
      market:
        +tags: [market]
      news:
        +tags: [news]
      parliament:
        +tags: [parliament]
      politics:
        +tags: [politics]
      symbolic:
        +tags: [symbolic]
      taxes:
        +tags: [taxes]
      welfare:
        +tags: [welfare]
    silver:
      +materialized: view
      +schema: silver
      philosophy:
        +tags: [philosophy]
      ai_politics:
        +tags: [ai_politics]
      eu_ai_act:
        +tags: [ai_act]
      jobs:
        +tags: [jobs]
      parliament:
        +tags: [parliament]
      symbolic:
        +tags: [symbolic]
      welfare:
        +tags: [welfare]
    gold:
      +materialized: table
      +schema: gold
      cross_domain:
        +tags: [cross_domain]
      concepts:
        +tags: [concepts]
      philosophy:
        +tags: [philosophy]
      job_ai_governance:
        +tags: [job_ai_governance]
      ai_politics:
        +tags: [ai_politics]
      eu_ai_act:
        +tags: [ai_act]
      jobs:
        +tags: [jobs]
      market:
        +tags: [market]
      news:
        +tags: [news]
      parliament:
        +tags: [parliament]
      politics:
        +tags: [politics]
      symbolic:
        +tags: [symbolic]
      taxes:
        +tags: [taxes]
      welfare:
        +tags: [welfare]
        serving:
          +tags: [welfare, serving]
      shared:
        +tags: [welfare]

# The welfare subject builds from files fetched by ingest/{scb,fohm,fk,ess,kolada}; its
# tag lets it build on its own: `dbt build --select tag:welfare`.
seeds:
  portfolio:
    cross_domain:
      +tags: [cross_domain]
      +schema: seeds
      ai_governance_series:
        +column_types: {sort_order: integer}
    concepts:
      +tags: [concepts]
      +schema: seeds
      concepts:
        +column_types: {sort_order: integer}
      concept_links:
        +column_types: {note: varchar}
      cluster_concept_reviews:
        +column_types: {concept_source: varchar, cluster_variant: varchar, fingerprint: varchar, concept_id: varchar, reviewer: varchar, reviewed_at: date, note: varchar}
    philosophy:
      +tags: [philosophy]
      +schema: seeds
      tensions:
        +column_types: {sort_order: integer}
    job_ai_governance:
      +tags: [job_ai_governance]
      +schema: seeds
      job_ai_governance_terms:
        +column_types: {case_sensitive: boolean, sort_order: integer}
    ai_politics:
      +tags: [ai_politics]
      +schema: seeds
      ai_politics_concepts:
        +column_types: {case_sensitive: boolean, sort_order: integer}
    eu_ai_act:
      +tags: [ai_act]
      +schema: seeds
      ai_act_application_rules:
        +column_types: {chapter: varchar, section: varchar, article_from: integer, article_to: integer, applies_from: date, applies_from_second: date, partial: boolean, priority: integer, source_article: varchar}
      ai_act_obligations:
        +column_types: {article: varchar, paragraph: varchar}
      ai_act_milestones:
        +column_types: {date: date, source_article: varchar, affected_articles: varchar, affected_actors: varchar}
      ai_act_actors:
        +column_types: {definition_point: varchar, sort_order: integer}
      ai_act_risk_classes:
        +column_types: {source_article: varchar, sort_order: integer}
    symbolic:
      +tags: [symbolic]
      +schema: seeds
      +column_types: {symbol_id: varchar}
    news:
      +tags: [news]
      +schema: seeds
      news_party_terms:
        +column_types: {party: varchar, pattern: varchar}
      news_topics:
        +column_types: {topic: varchar, name_sv: varchar, name_en: varchar, pattern: varchar}
    politics:
      +tags: [politics]
      +schema: seeds
      budget_governance:
        +column_types: {session: varchar, budget_year: integer, government_parties: varchar,
                        agreement_parties: varchar, agreement_source_url: varchar, adopted: varchar,
                        alternative_parties: varchar, alternative_source_url: varchar}
    parliament:
      +tags: [parliament]
      +schema: seeds
      governments:
        +column_types: {government_key: varchar, government_name: varchar, prime_minister: varchar,
                        prime_minister_party: varchar, government_parties: varchar,
                        start_date: date, end_date: date, agreement_name: varchar,
                        agreement_parties: varchar, status_note: varchar, source_url: varchar}
      committees:
        +column_types: {committee_key: varchar, committee_code: varchar, committee_name: varchar,
                        issue_key: varchar, active_note: varchar}
      issues:
        +column_types: {issue_key: varchar, issue_name_sv: varchar, issue_name_en: varchar,
                        expenditure_areas: varchar, welfare_indicators: varchar, summary_sv: varchar}
    taxes:
      +tags: [taxes]
      +schema: seeds
      tax_countries:
        +column_types: {country_code: varchar, name_sv: varchar, name_en: varchar,
                        is_nordic: boolean, is_eu: boolean}
      tax_types:
        +column_types: {tax_code: varchar, name_sv: varchar, name_en: varchar,
                        parent_code: varchar, is_headline: boolean, note_sv: varchar}
      tax_decisions:
        +column_types: {decision_key: varchar, in_force: date, component: varchar,
                        direction: varchar, title_sv: varchar, title_en: varchar,
                        bill: varchar, bill_section: varchar, report: varchar,
                        origin: varchar, source_url: varchar,
                        petrol_sek_per_litre: double, diesel_sek_per_litre: double,
                        months: integer}
      vat_spending_groups:
        +column_types: {spending_group: varchar, name_sv: varchar, name_en: varchar,
                        vat_rate: double, note_sv: varchar}
      household_types:
        +column_types: {household_type: varchar, name_sv: varchar, name_en: varchar}
    welfare:
      +tags: [welfare]
      +schema: seeds
      region_nuts:
        +column_types: {county_code: varchar, nuts3_code: varchar, nuts2_code: varchar, nuts2_name: varchar}
      ess_rounds:
        +column_types: {essround: integer, reference_year: integer, fieldwork_label: varchar}
      kolada_kpis:
        +column_types: {kpi_id: varchar, domain: varchar, welfare_dimension: varchar, higher_is_better: boolean}
      ess_variables:
        +column_types: {scale_min: integer, scale_max: integer, higher_is_better: boolean, share_threshold: integer}
      fohm_measures:
        +column_types: {topic: varchar, measure_code: varchar, domain: varchar, higher_is_better: boolean}
      indicators:
        +column_types: {higher_is_better: boolean}
      ess_countries:
        +column_types: {is_nordic: boolean, is_eu27: boolean}
      indicator_aggregation:
        +column_types: {indicator_key: varchar, measure_type: varchar, time_rule: varchar, space_rule: varchar,
                        weight_indicator: varchar, components: varchar, aggregation_note: varchar}
