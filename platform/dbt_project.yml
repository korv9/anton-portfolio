name: portfolio
version: '1.0.0'
config-version: 2
profile: portfolio

model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]
macro-paths: [macros]
clean-targets: [target, dbt_packages]

flags:
  send_anonymous_usage_stats: false

# Medallion layers are schemas in the warehouse, not directories of files. Only bronze
# reads from disk; silver and gold are built and stay inside DuckDB until publish/
# exports the delivery artefacts.
models:
  portfolio:
    bronze:
      +materialized: view
      +schema: bronze
      welfare:
        +tags: [welfare]
    silver:
      +materialized: view
      +schema: silver
      welfare:
        +tags: [welfare]
    gold:
      +materialized: table
      +schema: gold
      welfare:
        +tags: [welfare]
      shared:
        +tags: [welfare]

# The welfare subject builds from files fetched by ingest/{scb,fohm,fk,ess,kolada}; its
# tag lets it build on its own: `dbt build --select tag:welfare`.
seeds:
  portfolio:
    welfare:
      +tags: [welfare]
      +schema: seeds
      region_nuts:
        +column_types: {county_code: varchar, nuts3_code: varchar, nuts2_code: varchar, nuts2_name: varchar}
      ess_rounds:
        +column_types: {essround: integer, reference_year: integer, fieldwork_label: varchar}
      kolada_kpis:
        +column_types: {kpi_id: varchar, domain: varchar, welfare_dimension: varchar, higher_is_better: boolean}
      ess_variables:
        +column_types: {scale_min: integer, scale_max: integer, higher_is_better: boolean, share_threshold: integer}
      fohm_measures:
        +column_types: {topic: varchar, measure_code: varchar, domain: varchar, higher_is_better: boolean}
      indicators:
        +column_types: {higher_is_better: boolean}
      ess_countries:
        +column_types: {is_nordic: boolean, is_eu27: boolean}
