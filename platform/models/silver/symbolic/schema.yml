version: 2

models:
  - name: int_symbolic_documents
    description: Each book's narrative text without Gutenberg's header and licence or paratext (contents, glossaries, indexes, notes, bibliographies, footnotes; nlp/symbolic/cleaning.py), white space collapsed, words and punctuation kept, with its cleaning audit.
    columns:
      - name: document_id
        tests: [unique, not_null]
      - name: clean_text
        tests: [not_null]
      - name: removed_share
        description: Share of the text after boilerplate removal that the paratext rules removed (the model fails above 0.5).
        tests: [not_null]
      - name: cleaning_version
        tests: [not_null]
  - name: int_symbol_occurrences
    description: One row per symbol word (seeds/symbolic/symbol_aliases.csv) with the previous, matching and next sentence.
    columns:
      - name: occurrence_id
        tests: [unique, not_null]
      - name: document_id
        tests:
          - relationships:
              to: ref('int_symbolic_documents')
              field: document_id
      - name: symbol_id
        tests:
          - relationships:
              to: ref('symbols')
              field: symbol_id
      - name: context
        tests: [not_null]
