version: 2

models:
  - name: stg_ad_language_hits
    description: Archive × year × field × county × length band × category counts in JobTech's job ads.
    data_tests:
      - unique_combination:
          arguments:
            columns: [archive, year, field, region, band, category]
            # Ads with no occupation field or county in the source keep a null.
            nullable: [field, region]
  - name: stg_ad_language_totals
    description: Archive × year × field × county × length band totals over all job ads.
    data_tests:
      - unique_combination:
          arguments:
            columns: [archive, year, field, region, band]
            # Ads with no occupation field or county in the source keep a null.
            nullable: [field, region]
  - name: stg_ad_language_mix
    description: Archive × year × SSYK-4 occupation group × employer type × category counts.
    data_tests:
      - unique_combination:
          arguments:
            columns: [archive, year, occupation_group, employer_type, category]
