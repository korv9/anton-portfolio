version: 2

# The whole job market: counts of every ad in JobTech's historical archives from 2020, made by
# platform/ingest/jobtech/ingest_market.py. No ad is kept, only counts per month, occupation
# group and county, and per month, occupation field and conditions of employment. The daily
# stream (platform/ingest/jobtech/ingest_stream.py) adds the same counts after the archives
# end, and ads per day.

sources:
  - name: jobtech_market
    description: Ad counts per archive (one file per archive year or quarter).
    tables:
      - name: ads
        description: Ads and vacancies per publication month, occupation field, occupation group and county.
        meta:
          external_location: >-
            read_parquet('{{ env_var('PORTFOLIO_RAW', '../warehouse/raw') }}/jobtech/market/ads_*.parquet',
            filename = true)
      - name: conditions
        description: Ads and vacancies per publication month and occupation field, by employment type, working hours and required experience.
        meta:
          external_location: >-
            read_parquet('{{ env_var('PORTFOLIO_RAW', '../warehouse/raw') }}/jobtech/market/conditions_*.parquet',
            filename = true)
      - name: daily
        description: >-
          Ads and vacancies per publication day and occupation field ('all' for every field),
          from JobTech's stream (ingest_stream.py), for the days the stream covers whole.
        meta:
          external_location: >-
            read_parquet('{{ env_var('PORTFOLIO_RAW', '../warehouse/raw') }}/jobtech/market/daily_stream.parquet')
      - name: manifests
        description: One record per archive counted, with its source URL and SHA-256.
        meta:
          external_location: >-
            read_json('{{ env_var('PORTFOLIO_RAW', '../warehouse/raw') }}/jobtech/market/manifest_*.json', union_by_name = true)
