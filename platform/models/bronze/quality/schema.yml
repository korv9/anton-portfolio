version: 2

models:
  - name: stg_quality_products
    description: The products the quality registry covers.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: stg_quality_confounders
    description: Registered confounders per analysis.
    data_tests:
      - unique_combination:
          arguments:
            columns: [analysis, confounder]
  - name: stg_quality_validity
    description: One row per analytical validity diagnostic.
    data_tests:
      - unique_combination:
          arguments:
            columns: [analysis_id, diagnostic_id]
  - name: stg_quality_checks
    description: One row per data-quality check result.
    columns:
      - name: quality_check_id
        data_tests: [unique, not_null]
  - name: stg_quality_validity_history
    description: Validity diagnostics across recorded runs.
    data_tests:
      - unique_combination:
          arguments:
            columns: [analysis_id, run_label, experiment, metric]
  - name: stg_raw_fetch_log
    description: One row per fetch of a raw file across every source's fetch log.
    columns:
      - name: raw_source
        data_tests: [not_null]
      - name: ingested_at
        data_tests: [not_null]
      - name: sha256
        description: The hash of the stored bytes; absent only on a failed request.
        data_tests:
          - not_null: {config: {where: "error is null and entry = 'file'"}}
      - name: bytes
        data_tests:
          - not_null: {config: {where: "error is null and entry = 'file'"}}
          - between:
              arguments: {min: 0, max: 100000000000}
