version: 2

models:
  - name: stg_futures_hits
    description: Session × year × party × theme counts in Riksdag speeches.
    data_tests:
      - unique_combination:
          arguments:
            columns: [session, year, party, theme]
            # Speeches with no party in the source keep a null party.
            nullable: [party]
  - name: stg_futures_totals
    description: Session × year × party totals over all Riksdag speeches.
    data_tests:
      - unique_combination:
          arguments:
            columns: [session, year, party]
            # Speeches with no party in the source keep a null party.
            nullable: [party]
  - name: stg_futures_lengths
    description: Session × year × words in the speech; speeches and future-oriented speeches.
    data_tests:
      - unique_combination:
          arguments:
            columns: [session, year, words]
  - name: stg_futures_theses
    description: DiVA thesis abstracts per harvested month × record × theme.
    data_tests:
      - unique_combination:
          arguments:
            columns: [month, id, theme]
  - name: stg_futures_theses_detail
    description: DiVA thesis records from 2019-01 per harvested month × record.
    data_tests:
      - unique_combination:
          arguments:
            columns: [month, id]
  - name: stg_futures_topics
    description: Futures topic pilot, one sampled sentence (id only) × cluster.
    columns:
      - name: sentence_id
        data_tests: [not_null, unique]
      - name: corpus
        data_tests:
          - accepted_values:
              arguments:
                values: [riksdag, diva]
  - name: stg_futures_topic_cells
    description: Futures topic pilot, cluster × corpus × year with the share's bootstrap interval.
    data_tests:
      - unique_combination:
          arguments:
            columns: [cluster, corpus, year]
  - name: stg_futures_topic_clusters
    description: Futures topic pilot, cluster × corpus statistics.
    data_tests:
      - unique_combination:
          arguments:
            columns: [cluster, corpus]
