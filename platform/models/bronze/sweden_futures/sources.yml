version: 2

# SWEDEN E, The Lost Futures: counts of future-oriented language in Riksdag speeches, written by
# platform/ingest/riksdagen/futures_language.py under warehouse/features/sweden/futures.

sources:
  - name: futures
    description: Theme matches in Riksdagen's speech archives (open data), per session.
    tables:
      - name: totals
        description: Year × party; speeches, future-oriented speeches, words and future-marker matches.
        meta:
          external_location: >-
            read_parquet('{{ env_var('PORTFOLIO_FEATURES', '../warehouse/features') }}/sweden/futures/totals_*.parquet', union_by_name = true)
      - name: hits
        description: The same cells × theme; speeches using it, of them future-oriented, and matches.
        meta:
          external_location: >-
            read_parquet('{{ env_var('PORTFOLIO_FEATURES', '../warehouse/features') }}/sweden/futures/hits_*.parquet', union_by_name = true)
      - name: lengths
        description: Year × words in the speech (capped); speeches and future-oriented speeches.
        meta:
          external_location: >-
            read_parquet('{{ env_var('PORTFOLIO_FEATURES', '../warehouse/features') }}/sweden/futures/lengths_*.parquet', union_by_name = true)
      - name: theses
        description: >-
          Swedish-language student-thesis abstracts in DiVA (CC0 metadata), per harvested month: one
          row per OAI record and theme it matches; theme '_all' carries the words, and a null year marks
          a deleted record or one without a Swedish abstract. Written by platform/ingest/diva/futures_theses.py.
        meta:
          external_location: >-
            read_parquet('{{ env_var('PORTFOLIO_FEATURES', '../warehouse/features') }}/sweden/futures_theses/*.parquet', union_by_name = true)
      - name: theses_detail
        description: >-
          DiVA student-thesis records from record month 2019-01, per harvested month: OAI setSpecs
          (institution, HSV subject area), dc:type values, words and the future marker's matches per
          alternative; a null year marks a deleted record or one without a Swedish abstract. Written
          by platform/ingest/diva/futures_theses_detail.py.
        meta:
          external_location: >-
            read_parquet('{{ env_var('PORTFOLIO_FEATURES', '../warehouse/features') }}/sweden/futures_theses_detail/*.parquet', union_by_name = true)
      - name: topics
        description: >-
          The futures topic pilot: one future-marked sentence per sampled Riksdag speech or DiVA
          abstract (ids only, no text) with its unsupervised cluster (-1 is noise), membership
          probability, embedding model, revision and run id. Written by ml/futures_topics/analyze.py;
          pre-registered in docs/sweden-futures-topics-preregistration.md.
        meta:
          external_location: >-
            read_parquet('{{ env_var('PORTFOLIO_FEATURES', '../warehouse/features') }}/sweden/futures_topics/topics.parquet')
      - name: topic_cells
        description: Cluster × corpus × year; sentences and a 95 % bootstrap interval of the share.
        meta:
          external_location: >-
            read_parquet('{{ env_var('PORTFOLIO_FEATURES', '../warehouse/features') }}/sweden/futures_topics/cells.parquet')
      - name: topic_clusters
        description: >-
          Cluster × corpus; unreviewed label, c-TF-IDF top terms, stability, trend test and the
          Riksdag-DiVA correlation and lag check, with Holm-adjusted p-values.
        meta:
          external_location: >-
            read_parquet('{{ env_var('PORTFOLIO_FEATURES', '../warehouse/features') }}/sweden/futures_topics/clusters.parquet')
