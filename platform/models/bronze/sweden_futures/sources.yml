version: 2

# SWEDEN E, The Lost Futures: counts of future-oriented language in Riksdag speeches, written by
# platform/ingest/riksdagen/futures_language.py under warehouse/features/sweden/futures.

sources:
  - name: futures
    description: Theme matches in Riksdagen's speech archives (open data), per session.
    tables:
      - name: totals
        description: Year × party; speeches, future-oriented speeches and words.
        meta:
          external_location: >-
            read_parquet('{{ env_var('PORTFOLIO_FEATURES', '../warehouse/features') }}/sweden/futures/totals_*.parquet', union_by_name = true)
      - name: hits
        description: The same cells × theme; speeches using it, of them future-oriented, and matches.
        meta:
          external_location: >-
            read_parquet('{{ env_var('PORTFOLIO_FEATURES', '../warehouse/features') }}/sweden/futures/hits_*.parquet', union_by_name = true)
      - name: theses
        description: >-
          Swedish-language student-thesis abstracts in DiVA (CC0 metadata), per harvested month:
          publication year × theme; theme '_all' carries abstracts, future-oriented abstracts and words.
          Written by platform/ingest/diva/futures_theses.py.
        meta:
          external_location: >-
            read_parquet('{{ env_var('PORTFOLIO_FEATURES', '../warehouse/features') }}/sweden/futures_theses/*.parquet', union_by_name = true)
