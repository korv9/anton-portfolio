version: 2

# The Swedish laws behind "Fråga lagen", and with --all the whole statute book, fetched by
# platform/ingest/sfs/ingest.py into warehouse/raw/sfs exactly as data.riksdagen.se serves them.

sources:
  - name: sfs
    description: Riksdagen's plain text of each SFS document, the list, the selection and the fetch log.
    tables:
      - name: texts
        description: One law per file, texts/<dok_id>.text, as served.
        meta:
          external_location: >-
            read_text('{{ env_var('PORTFOLIO_RAW', '../warehouse/raw') }}/sfs/texts/*.text')
      - name: catalogue
        description: >-
          Every document in /dokumentlista/?doktyp=sfs (ingest.py --all): dok_id, beteckning,
          titel, datum, organ, subtyp and systemdatum, as the list gave them.
        meta:
          external_location: >-
            read_json('{{ env_var('PORTFOLIO_RAW', '../warehouse/raw') }}/sfs/catalogue.json')
      - name: selection
        description: The laws kept from configs/workers_ai/sfs_selection.yaml, repealed ones left out.
        meta:
          external_location: >-
            read_json('{{ env_var('PORTFOLIO_RAW', '../warehouse/raw') }}/sfs/selection.json')
      - name: fetches
        config:
          loaded_at_field: cast(fetched_at as timestamptz)
          # Weekly (Saturday); warns at the subject's sla.fresh_within in platform/pipeline.yml.
          freshness:
            warn_after: {count: 8, period: day}
            error_after: {count: 16, period: day}
        description: One line per fetch with URL, time, SHA-256 and size (lib/rawstore.py).
        meta:
          external_location: >-
            read_json('{{ env_var('PORTFOLIO_RAW', '../warehouse/raw') }}/sfs/_manifest.jsonl',
            format = 'newline_delimited', union_by_name = true)
