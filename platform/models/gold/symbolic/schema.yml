version: 2

models:
  - name: mart_symbol_atlas
    description: One point per sampled symbol occurrence with its map position, cluster and context.
    columns:
      - name: occurrence_id
        tests: [unique, not_null]
      - name: symbol_id
        tests:
          - relationships:
              to: ref('symbols')
              field: symbol_id
      - name: x
        tests: [not_null]
      - name: y
        tests: [not_null]
      - name: cluster_id
        tests: [not_null]
  - name: mart_symbol_profiles
    description: Per symbol and cluster, how many occurrences and what share of the symbol's points.
    columns:
      - name: symbol_id
        tests: [not_null]
      - name: occurrence_count
        tests: [not_null]
