version: 2

models:
  - name: fct_tax_revenue
    description: Tax revenue per country, year and tax type (OECD Revenue Statistics), share of GDP and national currency.
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_code, year, tax_code]
  - name: fct_tax_wedge
    description: Labour taxation per country, year, household type and wage level (OECD Taxing Wages).
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_code, year, household_type, wage_level, spouse_wage_level]
  - name: fct_municipal_tax_rate
    description: Local income tax, burial and church fee rates per parish and year (Skatteverket).
    data_tests:
      - unique_combination:
          arguments:
            columns: [year, parish_code, parish_name]
  - name: dim_tax_type
    columns:
      - name: tax_code
        data_tests: [unique, not_null]
  - name: dim_tax_country
    columns:
      - name: country_code
        data_tests: [unique, not_null]
  - name: dim_tax_decision
    description: Riksdag decisions that changed taxes from 2016, with bill, report and origin.
    columns:
      - name: decision_key
        data_tests: [unique, not_null]
      - name: direction
        data_tests:
          - accepted_values:
              arguments:
                values: [lower, higher]
      - name: origin
        data_tests:
          - accepted_values:
              arguments:
                values: [government, committee, reservation]
      - name: bill_title
        description: Empty only for decisions taken on the committee's proposal or a reservation.
  - name: fct_tax_decision_vote
    description: Each party's vote on each tax decision, in the first substantive roll call of its report.
    data_tests:
      - unique_combination:
          arguments:
            columns: [decision_key, party]
  - name: fct_tax_decision_study
    description: The studies a tax decision's bill names as its preparation.
    data_tests:
      - unique_combination:
          arguments:
            columns: [decision_key, study_key]
  - name: fct_household_vat
    description: Estimated VAT per household type and spending group (SCB HUT and VAT rates).
    data_tests:
      - unique_combination:
          arguments:
            columns: [household_type, year, spending_group]
