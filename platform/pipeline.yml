# Every subject, from source to site. Read by platform/pipeline.py; nothing else defines a
# step sequence, a dbt selector or a raw path list. docs/pipeline.md describes how it runs.
#
# A subject is an ordered list of steps. Each step has one phase key:
#   ingest   a command that fetches or prepares inputs
#   dbt      {select, exclude, freshness}; built into platform/target/<subject>; freshness: true
#            first runs dbt source freshness on the sources upstream of select, warn-only
#   ml       a command, skipped by --ml missing when `marker` (under warehouse/features) exists;
#            `stale_arg` is appended unless --ml always, and makes the stage check its inputs
#   export   a command that writes delivery files; runs only if the subject's dbt tests passed
# Step options: when_env (skip unless the variable is set), ok_exit (tolerated exit codes).
# Commands run from the repository root. ${NAME:-default} reads the environment, {sha} is the
# commit being published.
#
# Subject keys: schedule (cron of the workflow that runs it, or manual), group (the delivery
# group in configs/delivery that owns its files), needs (subjects that must not have failed in
# the same run), raw and features (paths under warehouse/raw and warehouse/features kept in R2),
# prune (raw pushes delete remote files that are gone locally), target (dbt target folder when it
# differs from the subject name), manual (left out of --all, and not required by its group),
# sources (raw folders whose fetch log is kept outside R2 by the ingest itself, for the
# ingestion status in status/ingestion.json; the first segments of `raw` count already).
#
# Every subject also declares, without changing what the code does:
#   sla    {fresh_within: <n>h | <n>d | none}: how old its last successful ingestion in
#          status/ingestion.json may be before data-heartbeat.yml opens a data-freshness issue;
#          none for manual subjects. Its dbt source freshness warns at the same age.
#   write  per layer it writes, the mode the code uses today:
#          raw, features  R2 under warehouse/: mirror (prune: true, remote files gone locally are
#                         deleted) or {merge: [keys]} (upload changed objects, delete nothing)
#          warehouse      overwrite: every dbt model is a view or a table, rebuilt in full
#          delivery       versioned: release.py publishes an immutable release, then swaps the pointer
# The dbt tests are the data-quality gate: an export runs only if every one of them passed.
#
# A group is published once, after every subject in it has succeeded.

definitions:
  data_catalog: &data_catalog python platform/publish/build_catalog.py
  data_check: &data_check
    - python platform/legacy/validate_gold.py
    - python platform/legacy/validate_budget_context.py
    - python platform/legacy/validate_products.py
    - python platform/legacy/validate_politics.py

groups:
  public-data:
    publish:
      - python platform/publish/export_schema.py
      - python platform/publish/export_er.py
      - python platform/architecture/build_graph.py
      - *data_catalog
      - *data_check
      - python platform/publish/validate_public_data.py
      - python platform/publish/release.py materialize --root frontend/public/data --spec configs/delivery/public-data.json --catalog frontend/public/data/catalog.json
      - python platform/publish/release.py publish --group public-data --root frontend/public/data --spec configs/delivery/public-data.json --code-sha {sha}
      - python platform/publish/publish_status.py
  jobs:
    publish:
      - python platform/publish/validate_refresh_delivery.py --group jobs --root frontend/public/data --stream-state warehouse/raw/jobtech/stream/state.json
      - python platform/publish/release.py publish --group jobs --root frontend/public/data --spec configs/delivery/jobs.json --code-sha {sha}
  news:
    publish:
      - python platform/publish/release.py publish --group news --root frontend/public/data --spec configs/delivery/news.json --code-sha {sha}
  jobs-analysis:
    publish:
      - *data_catalog
      - *data_check
      - python platform/publish/release.py materialize --root frontend/public/data --spec configs/delivery/jobs-analysis.json --catalog frontend/public/data/catalog.json
      - python platform/publish/release.py publish --group jobs-analysis --root frontend/public/data --spec configs/delivery/jobs-analysis.json --code-sha {sha}
  diva:
    publish:
      - python platform/publish/validate_refresh_delivery.py --group diva --root frontend/public/data
      - python platform/publish/release.py publish --group diva --root frontend/public/data --spec configs/delivery/diva.json --code-sha {sha}
  # SWEDEN publishes on its own, so a failed SWEDEN source never holds back the baseline.
  sweden:
    publish:
      - python platform/publish/release.py publish --group sweden --root frontend/public/data --spec configs/delivery/sweden.json --code-sha {sha}
  baseline:
    publish:
      - *data_catalog
      - *data_check
      - python platform/publish/release.py materialize --root frontend/public/data --spec configs/delivery/baseline.json --catalog frontend/public/data/catalog.json
      - python platform/publish/release.py publish --group baseline --root frontend/public/data --spec configs/delivery/baseline.json --code-sha {sha}

subjects:
  welfare:
    schedule: '37 4 * * *'
    sla: {fresh_within: 36h}
    write: {raw: mirror, warehouse: overwrite, delivery: versioned}
    group: public-data
    raw: [scb, fohm, fk, ess, kolada]
    prune: true
    steps:
      - ingest: python platform/ingest/scb/scb_ingest.py
      - ingest: python platform/ingest/fohm/fohm_ingest.py
      - ingest: python platform/ingest/fk/fk_ingest.py
      - ingest: python platform/ingest/ess/ess_ingest.py
      - ingest: python platform/ingest/kolada/kolada_ingest.py
      - dbt: {select: [tag:welfare]}
      - export: python platform/publish/export_welfare.py

  parliament:
    schedule: '37 4 * * *'
    sla: {fresh_within: 36h}
    write: {raw: mirror, warehouse: overwrite, delivery: versioned}
    group: public-data
    raw: [scb, riksdagen/votes, riksdagen/reports, riksdagen/studies, riksdagen/formation, riksdagen/formation_votes,
          riksdagen/_checkpoints, riksdagen/_manifest.jsonl, val]
    prune: true
    steps:
      - ingest: python platform/ingest/riksdagen/formation_ingest.py
      - ingest: python platform/ingest/riksdagen/history_ingest.py
      - ingest: python platform/ingest/elections/elections_ingest.py
      - ingest: python platform/ingest/riksdagen/studies_ingest.py
      # Its facts test against dim_party and dim_municipality, so both build with it.
      - dbt: {select: [tag:parliament, stg_party_vote, +dim_party, +dim_municipality]}
      - export: python platform/publish/export_parliament.py

  taxes:
    schedule: '37 4 * * *'
    sla: {fresh_within: 36h}
    write: {raw: mirror, warehouse: overwrite, delivery: versioned}
    group: public-data
    needs: [parliament]
    raw: [oecd, skatteverket]
    prune: true
    steps:
      # Rejects partial or unverified parliament inputs before dbt can build on them.
      - ingest: python platform/ingest/taxes/require_parliament.py
      - ingest: python platform/ingest/taxes/taxes_ingest.py
      - dbt: {select: [+tag:taxes, +dim_municipality]}
      - export: python platform/publish/export_taxes.py

  market:
    schedule: '23 4 * * *'
    sla: {fresh_within: 36h}
    write: {raw: {merge: [path]}, warehouse: overwrite, delivery: versioned}
    group: jobs
    raw: [jobtech/market, jobtech/stream, jobtech/_manifest.jsonl]
    steps:
      - ingest: python platform/ingest/jobtech/ingest_market.py
      - ingest: python platform/ingest/jobtech/ingest_stream.py
      - dbt: {select: [tag:market]}
      - export: python platform/publish/export_market.py
      - export: python platform/publish/job_companies.py refresh

  news:
    schedule: '17 5 * * *'
    sla: {fresh_within: 36h}
    write: {raw: {merge: [id]}, warehouse: overwrite, delivery: versioned}
    group: news
    sources: [news]
    steps:
      # The last approved summary first, so a failed summary step keeps it.
      - ingest: python platform/publish/release.py materialize --root frontend/public/data --spec configs/delivery/news.json --catalog frontend/public/data/catalog.json --prefer-active
        when_env: R2_BUCKET
      - ingest: python platform/ingest/news/news_ingest.py --sync --months 3
      - ingest: python platform/ingest/news/people_ingest.py
      - dbt: {select: [tag:news], freshness: true}
      - export: python platform/publish/export_news.py
      # Optional: exit 2 means no summary was written and the headlines publish alone.
      - export: python platform/publish/summarize_news.py --days 7 --status-file ${RUNNER_TEMP:-warehouse}/news-summary-status.json
        when_env: ANTHROPIC_API_KEY
        ok_exit: [2]

  politics:
    schedule: '13 21 * * 6'
    sla: {fresh_within: 8d}
    write: {warehouse: overwrite, delivery: versioned}
    group: baseline
    steps:
      - dbt: {select: [+tag:politics]}
      - export: python platform/publish/export_politics.py

  # CI: politics from the committed deliveries in an empty warehouse, where the parliament
  # models have nothing to read, then proof that the export is byte-identical to the site's files.
  politics_check:
    schedule: every push
    sla: {fresh_within: none}
    write: {warehouse: overwrite}
    manual: true
    target: politics
    steps:
      - dbt: {select: [+tag:politics], exclude: ['tag:parliament']}
      - export: python platform/publish/export_politics.py --check

  # The builders not yet moved into dbt. build_politics.py is not here: it needs three local
  # sources (--parliament, --allegoria, --local-corpus), one of them in no repository.
  # Not dbt: build_gold.py writes 22 of gold/semantic-model.json's 31 tables in Python (dims
  # party, actor, session, expenditure_area, role, topic, law_snapshot; the decision-point,
  # vote, citation, reservation, speech/motion/proposition link, law mention/provision, budget
  # frame, job and UMAP facts) and marts/budget-report, jobs, debate, rfc-drift and overview.
  # dbt builds the other nine and the vote marts (models/gold/politics, export_politics.py),
  # and defines the model's metrics and relationships (docs/gold-semantic-model.md).
  legacy:
    schedule: manual
    sla: {fresh_within: none}
    write: {warehouse: overwrite, delivery: versioned}
    group: baseline
    manual: true
    target: politics
    steps:
      - ingest: python platform/legacy/build_gold.py
      - dbt: {select: [+tag:politics]}
      - export: python platform/publish/export_politics.py
      - export: python platform/legacy/build_products.py
      - export: python platform/legacy/build_speech_browser.py
      - export: python platform/publish/export_debates.py
      - export: *data_catalog

  ai_act:
    schedule: '13 21 * * 6'
    sla: {fresh_within: 8d}
    write: {raw: {merge: [path]}, warehouse: overwrite, delivery: versioned}
    group: baseline
    raw: [eu_ai_act]
    steps:
      - ingest: python platform/ingest/eu_ai_act/run.py
      - dbt: {select: [tag:ai_act], freshness: true}
      - export: python platform/publish/eu_ai_act/export_ai_act.py

  # The laws behind "Fråga lagen" (docs/workers-ai.md). The export writes the passages that
  # platform/nlp/workers_ai.py embeds; the embedding and compression run by hand within the quota.
  # With SFS_ALL set it also fetches the whole statute book (about 11,600 texts, a few hours the
  # first time); int_sfs_documents and int_sfs_corpus_paragraphs build on it, no embeddings.
  # export_sfs.py writes the statute-book page's numbers (#lagboken) from fct_sfs_document.
  sfs:
    schedule: '13 21 * * 6'
    sla: {fresh_within: 8d}
    write: {raw: {merge: [path]}, warehouse: overwrite, delivery: versioned}
    group: baseline
    raw: [sfs]
    steps:
      - ingest: python platform/ingest/sfs/ingest.py
      - ingest: python platform/ingest/sfs/ingest.py --all
        when_env: SFS_ALL
      - dbt: {select: [tag:sfs], freshness: true}
      - export: python platform/publish/workers_ai/export_law_corpora.py chunks
      - export: python platform/publish/export_sfs.py

  # assert_concept_link_targets_exist and assert_concept_tensions_exist check links into
  # philosophy, Riksdag and job-ad models; they run in the concepts subject, once all of them
  # are built.
  ai_politics:
    schedule: '13 21 * * 6'
    sla: {fresh_within: 8d}
    write: {raw: {merge: [path]}, features: {merge: [path]}, warehouse: overwrite, delivery: versioned}
    group: baseline
    needs: [ai_act]
    raw: [riksdagen/speeches]
    features: [ai_politics]
    steps:
      - ingest: python platform/ingest/riksdagen/ingest_speeches.py
      - dbt:
          select: [tag:ai_politics]
          freshness: true
          # The similarity stage's output and its staging views are built after the stage runs.
          exclude: [mart_ai_act_speech_similarity, stg_ai_politics_act_passages, stg_ai_politics_article_to_speech,
                    stg_ai_politics_similarity_run, assert_concept_link_targets_exist]
      - ml: python platform/nlp/ai_politics/similarity.py
        marker: ai_politics/run.json
        stale_arg: --if-stale
      - dbt:
          select: [stg_ai_politics_act_passages, stg_ai_politics_article_to_speech, stg_ai_politics_similarity_run,
                   mart_ai_act_speech_similarity]
      - export: python platform/publish/ai_politics/export_ai_politics.py

  symbolic:
    schedule: '13 21 * * 6'
    sla: {fresh_within: 8d}
    write: {raw: {merge: [path]}, features: {merge: [path]}, warehouse: overwrite, delivery: versioned}
    group: baseline
    raw: [symbolic]
    features: [symbolic]
    steps:
      - ingest: python platform/ingest/symbolic/ingest_corpus.py
      - ingest: python platform/ingest/symbolic/audit_corpus.py
      - dbt: {select: [tag:symbolic], exclude: ['path:models/gold/symbolic', stg_symbol_atlas_projection],
              freshness: true}
      # No marker: the stage itself compares the sample with the last run.
      - ml: python platform/nlp/symbolic/pipeline.py
        stale_arg: --if-stale
      - dbt: {select: ['path:models/gold/symbolic', stg_symbol_atlas_projection]}
      - export: python platform/publish/symbolic/export_symbolic.py

  philosophy:
    schedule: '13 21 * * 6'
    sla: {fresh_within: 8d}
    write: {raw: {merge: [path]}, features: {merge: [path]}, warehouse: overwrite, delivery: versioned}
    group: baseline
    raw: [philosophy]
    features: [philosophy]
    steps:
      - ingest: python platform/ingest/philosophy/ingest_corpus.py
      - dbt:
          select: [tag:philosophy]
          freshness: true
          exclude: ['path:models/gold/philosophy', stg_philosophy_atlas, stg_philosophy_clusters,
                    stg_philosophy_tensions, assert_concept_link_targets_exist]
      - ml: python platform/nlp/philosophy/pipeline.py
        marker: philosophy/run.json
        stale_arg: --if-stale
      # assert_concept_tensions_exist reads mart_concept_relations, built later by concepts.
      - dbt:
          select: ['path:models/gold/philosophy', stg_philosophy_atlas, stg_philosophy_clusters,
                   stg_philosophy_tensions]
          exclude: [assert_concept_link_targets_exist, assert_concept_tensions_exist]
      - export: python platform/publish/philosophy/export_philosophy.py

  job_ai_governance:
    schedule: '13 21 * * 6'
    sla: {fresh_within: 8d}
    write: {raw: {merge: [path]}, warehouse: overwrite, delivery: versioned}
    group: baseline
    raw: [jobtech/governance]
    steps:
      - ingest: python platform/ingest/jobtech/ingest_governance_terms.py
      - dbt: {select: [tag:job_ai_governance], exclude: [assert_concept_link_targets_exist]}
      - export: python platform/publish/job_ai_governance/export_job_ai_governance.py

  concepts:
    schedule: '13 21 * * 6'
    sla: {fresh_within: 8d}
    write: {features: {merge: [path]}, warehouse: overwrite, delivery: versioned}
    group: baseline
    needs: [ai_act, ai_politics, symbolic, philosophy, job_ai_governance]
    features: [concepts]
    steps:
      - ml: python platform/nlp/concepts/build.py
        marker: concepts/run.json
        stale_arg: --if-stale
      # Named: their models span other subjects, so buildable selection would not pick them.
      - dbt: {select: [tag:concepts, assert_concept_link_targets_exist, assert_concept_tensions_exist]}
      - export: python platform/publish/concepts/export_concepts.py

  cross_domain:
    schedule: '13 21 * * 6'
    sla: {fresh_within: 8d}
    write: {warehouse: overwrite, delivery: versioned}
    group: baseline
    needs: [ai_politics, job_ai_governance]
    steps:
      # The diffusion clock's mart sits beside the timeline but builds in its own subject.
      - dbt: {select: [tag:cross_domain], exclude: [tag:ai_act_diffusion]}
      - export: python platform/publish/cross_domain/export_ai_governance_timeline.py

  # The AI Act diffusion clock (docs/ai-act-diffusion-preregistration.md). The term counts are
  # made by hand: speeches locally with `python -m ml.ai_act.diffusion speeches`, the 2.79M ads in
  # cluster-jobs.yml (module `ml.ai_act.diffusion ads`, path ai_act/diffusion). This builds the
  # mart and the export from the stored counts.
  ai_act_diffusion:
    schedule: manual
    manual: true
    sla: {fresh_within: none}
    write: {features: {merge: [path]}, warehouse: overwrite, delivery: versioned}
    group: baseline
    needs: [ai_act]
    features: [ai_act/diffusion]
    steps:
      - dbt: {select: [tag:ai_act_diffusion]}
      - export: python platform/publish/cross_domain/export_ai_act_diffusion.py

  # SWEDEN research platform. A: catalogue metadata of SCB and Kolada (never the statistics).
  # C: the validated municipality clustering with SCB's boundaries (CC0); the run and the sources
  # it hashed are kept under features/sweden/similarity.
  # D: KB's library statistics (CC0) and Biblioteksdatabasen.
  # Its gold joins the welfare panel, tax rates and election results built earlier in the run.
  sweden:
    schedule: '13 21 * * 6'
    sla: {fresh_within: 8d}
    write: {raw: mirror, features: {merge: [path]}, warehouse: overwrite, delivery: versioned}
    group: sweden
    needs: [welfare, parliament, taxes]
    raw: [catalogue, geography, kb]
    features: [sweden/similarity]
    prune: true
    steps:
      - ingest: python platform/ingest/catalogue/catalogue_ingest.py
      - ingest: python platform/ingest/scb/boundaries.py
      - ingest: python platform/ingest/kb/libraries.py
      - dbt: {select: [tag:sweden]}
      - export: python platform/publish/sweden/export_measurement.py
      - export: python platform/publish/sweden/export_similarity.py
      - export: python platform/publish/sweden/export_belonging.py

  # SWEDEN B: language in every JobTech archive since 2006. Counts only; an unchanged archive
  # is skipped, so after the first run a week costs the newest quarter.
  sweden_language:
    schedule: '13 21 * * 6'
    sla: {fresh_within: 8d}
    write: {features: {merge: [path]}, warehouse: overwrite, delivery: versioned}
    group: sweden
    features: [sweden/ad_language]
    steps:
      # At most three new archives a run: the backfill since 2006 spreads over the first runs
      # and keeps the weekly build inside its timeout.
      - ingest: python platform/ingest/jobtech/ad_language.py --max-new 3
      - dbt: {select: [tag:sweden_language]}
      - export: python platform/publish/sweden/export_language.py

  # SWEDEN E: future-oriented language in every Riksdag session since 1993/94. Counts only; an
  # unchanged session is skipped.
  sweden_futures:
    schedule: '13 21 * * 6'
    sla: {fresh_within: 8d}
    write: {features: {merge: [path]}, warehouse: overwrite, delivery: versioned}
    group: sweden
    features: [sweden/futures, sweden/futures_theses, sweden/futures_theses_detail]
    steps:
      - ingest: python platform/ingest/riksdagen/futures_language.py --max-new 12
      # The academic corpus: DiVA student-thesis abstracts in Swedish, 60 harvested months a week.
      - ingest: python platform/ingest/diva/futures_theses.py --max-months 60
      # The 2024-25 jump taken apart: per-alternative counts from record month 2019-01.
      - ingest: python platform/ingest/diva/futures_theses_detail.py --max-months 6
      - dbt: {select: [tag:sweden_futures]}
      - export: python platform/publish/sweden/export_futures.py
      # Connections reads the other SWEDEN outputs, so it runs last.
      - export: python platform/publish/sweden/export_connections.py

  # Clustering batches 0-2 (platform/publish/clusters): one DuckDB pass over the local JobTech
  # cluster corpus, small fits on stored and published inputs, exports under clusters/. A run
  # stored under features/clusters is kept unless --ml always; the dbt tests gate the exports.
  # Five fits read published JSON under frontend/public/data, not marts, so each needs the
  # subject that exports it: eras and talk_vote (politics: gold/tables/fact_topic_session_party;
  # parliament: parliament/sessions.json), tax_mix (taxes), field_language (sweden_language);
  # trajectories and labour_market read sweden/similarity (sweden). session_maps reads the
  # committed politics/parliament/sessions/*/umap.json, which no subject here writes.
  clusters:
    schedule: '13 21 * * 6'
    sla: {fresh_within: 8d}
    write: {features: {merge: [path]}, warehouse: overwrite, delivery: versioned}
    group: sweden
    needs: [welfare, parliament, politics, taxes, sweden, sweden_language]
    features: [clusters]
    steps:
      - ml: python platform/publish/clusters/job_ads.py
        marker: clusters/job-ads/manifest.json
      - dbt: {select: [tag:clusters]}
      - ml: python platform/publish/clusters/debate_topics.py
        marker: clusters/debate-topics/run/metrics.json
      - ml: python platform/publish/clusters/session_maps.py
        marker: clusters/session-maps/run/metrics.json
      - ml: python platform/publish/clusters/talk_vote.py
        marker: clusters/talk-vote/run/metrics.json
      - ml: python platform/publish/clusters/trajectories.py
        marker: clusters/municipal-trajectories/run/metrics.json
      - ml: python platform/publish/clusters/eras.py
        marker: clusters/riksdag-eras/run/metrics.json
      - ml: python platform/publish/clusters/tax_mix.py
        marker: clusters/tax-mix/run/metrics.json
      - ml: python platform/publish/clusters/field_language.py
        marker: clusters/field-language/run/metrics.json
      - ml: python platform/publish/clusters/labour_market.py
        marker: clusters/labour-market-types/run/metrics.json
      - ml: python platform/publish/clusters/demand_curves.py
        marker: clusters/demand-curves/run/metrics.json
      - dbt: {select: [tag:clusters]}
      - export: python platform/publish/clusters/export.py

  quality:
    schedule: '13 21 * * 6'
    sla: {fresh_within: 8d}
    write: {warehouse: overwrite, delivery: versioned}
    group: baseline
    # evaluate.py keeps its own dbt test results in target/quality.
    target: quality_build
    steps:
      - ingest: python platform/quality/evaluate.py
      - dbt: {select: [tag:quality], freshness: true}
      - export: python platform/publish/quality/export_quality.py
      # Structural checks (gate: true in quality_registry.yml) fail the subject, after its report is written.
      - export: python platform/quality/evaluate.py --dbt-results platform/target/quality/run_results.json --gate

  diva:
    schedule: manual
    sla: {fresh_within: none}
    write: {raw: {merge: [path]}, delivery: versioned}
    group: diva
    manual: true
    raw: [diva]
    steps:
      - ingest: python platform/ingest/diva/harvest.py --from ${DIVA_FROM:-2023-01} --to ${DIVA_TO:-2025-12}
      - export: python platform/publish/diva_clusters.py

  # The IT report: run_history_pipeline.py picks the published archive years and passes them
  # to dbt as vars, so its dbt build (target/jobs) stays inside the script.
  jobs_analysis:
    schedule: manual
    sla: {fresh_within: none}
    write: {warehouse: overwrite, delivery: versioned}
    group: jobs-analysis
    manual: true
    steps:
      - ingest: python platform/ingest/jobtech/run_history_pipeline.py
      # Not dbt: rewrites the gold job tables and marts/jobs.json in Python from the CSVs above.
      - export: python platform/legacy/build_gold.py
