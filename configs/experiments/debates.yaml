# Acceptance criteria for a Replik debate-topic candidate, fixed on 2026-10-29 before any final
# evaluation ran (docs/cluster-experiments.md). Debates are kept whole on one side. Champion: the
# published SBERT pipeline (speaker centring, UMAP 5-D, HDBSCAN 150/25) refitted on the evaluation
# side without the consensus and noise reassignment steps, which a candidate does not get either.
frozen_at: '2026-10-29'
split_groups: [debate_id]
criteria:
  - {name: stable across seeds, metric: seed_stability.ari_mean, at_least: 0.6}
  - {name: at least five groups, metric: cluster_count, at_least: 5}
  - {name: noise ceiling, metric: noise_share, direction: lower, at_most: 0.45}
  - {name: party not more aligned, metric: dominance.party.ami, direction: lower, not_worse_than_champion: 0.01}
  - {name: speaker not more aligned, metric: dominance.speaker.ami, direction: lower, not_worse_than_champion: 0.01}
  - {name: debate dominance not worse, metric: dominance.debate.weighted_top_share, direction: lower, not_worse_than_champion: 0.02}
  - {name: separation not worse, metric: separation_representation, not_worse_than_champion: 0.03}
  - name: a measured gain
    any_of:
      - {metric: seed_stability.ari_mean, better_than_champion: 0.05}
      - {metric: separation_representation, better_than_champion: 0.03}
      - {metric: dominance.party.ami, direction: lower, better_than_champion: 0.01}
