# Acceptance criteria for a job-ad clustering candidate, fixed on 2026-10-29 before any final
# evaluation ran (docs/cluster-experiments.md, docs/job-clusters-mlops.md). Employers and texts are
# kept apart between selection and evaluation; the champion is the current pipeline refitted the
# same way. The MLOps retrain reuses these criteria for every later candidate.
frozen_at: '2026-10-29'
split_groups: [employer]
criteria:
  - {name: stable across seeds, metric: seed_stability.ari_mean, at_least: 0.6}
  - {name: at least five groups, metric: cluster_count, at_least: 5}
  - {name: noise ceiling, metric: noise_share, direction: lower, at_most: 0.4}
  - {name: no group over a third, metric: largest_cluster_share, direction: lower, at_most: 0.34}
  - {name: employer dominance not worse, metric: dominance.employer.weighted_top_share, direction: lower, not_worse_than_champion: 0.02}
  - {name: separation not worse, metric: separation_representation, not_worse_than_champion: 0.03}
  - name: a measured gain
    any_of:
      - {metric: seed_stability.ari_mean, better_than_champion: 0.05}
      - {metric: separation_representation, better_than_champion: 0.03}
      - {metric: noise_share, direction: lower, better_than_champion: 0.05}
