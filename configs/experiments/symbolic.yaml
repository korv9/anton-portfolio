# Acceptance criteria for a Symbol Lab candidate, fixed on 2026-10-29 before any final evaluation
# ran (docs/cluster-experiments.md). Champion: the published v4 pipeline refitted on the evaluation side.
frozen_at: '2026-10-29'
split_groups: [document_id]
criteria:
  - {name: stable across seeds, metric: seed_stability.ari_mean, at_least: 0.5}
  - {name: at least five groups, metric: cluster_count, at_least: 5}
  - {name: noise ceiling, metric: noise_share, direction: lower, at_most: 0.6}
  - {name: book dominance not worse, metric: dominance.book.weighted_top_share, direction: lower, not_worse_than_champion: 0.02}
  - {name: symbol-word dominance not worse, metric: dominance.symbol.weighted_top_share, direction: lower, not_worse_than_champion: 0.02}
  - {name: separation not worse, metric: separation_representation, not_worse_than_champion: 0.03}
  - name: a measured gain
    any_of:
      - {metric: dominance.book.weighted_top_share, direction: lower, better_than_champion: 0.05}
      - {metric: dominance.symbol.weighted_top_share, direction: lower, better_than_champion: 0.05}
      - {metric: seed_stability.ari_mean, better_than_champion: 0.05}
