# The Swedish laws behind "Fråga lagen" (Ask the law), read by platform/ingest/sfs/ingest.py.
# Each SFS number is fetched by its dok_id (sfs-<year>-<number>) from data.riksdagen.se, and the
# ingest checks the text's "SFS nr:" header against it and skips a law whose header says
# "Upphävd:". `title` is the first line of the text as Riksdagen serves it. Every law is kept
# whole: Socialförsäkringsbalken, the largest, is about 2,000 passages and 0.2 M tokens.
