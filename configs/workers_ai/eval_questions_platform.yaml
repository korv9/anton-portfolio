# Questions for Ask the platform (docs/workers-ai.md), read by
# platform/publish/workers_ai/eval_answer.ts --questions eval_questions_platform.yaml. They are
# asked as a hiring manager or data engineer might ask them about this repository. `expected` lists
# passage ids in workers-ai/platform/meta.json that answer the question; a retrieval counts as a
# hit when any of them is among the top k.
questions:
  - corpus: platform
    question: How is the junior share tested?
    question_en: How is the junior share tested?
    expected: [dbt:fct_job_ads, docs/data-dictionary.md#jobbannonser-junior-per-månad]
  - corpus: platform
    question: Where do the election results come from?
    question_en: Where do the election results come from?
    expected: [graph:src:valmyndigheten, graph:ingest:elections, dbt:fct_election]
  - corpus: platform
    question: How was the model behind Ask the law chosen?
    question_en: How was the model behind Ask the law chosen?
    expected: [docs/workers-ai.md#modellval, docs/workers-ai.md#modellval-2]
  - corpus: platform
    question: What happens when the daily Workers AI quota runs out?
    question_en: What happens when the daily Workers AI quota runs out?
    expected: [docs/workers-ai.md#workern]
  - corpus: platform
    question: When does the weekly warehouse build run?
    question_en: When does the weekly warehouse build run?
    expected: [docs/pipeline.md#subjects]
  - corpus: platform
    question: Where are the credentials kept?
