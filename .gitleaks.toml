# Picked up by `gitleaks git` from the repository root (docs/platform/security.md). The scan covers every
# fetched branch, so an exception here also holds for commits that never reached main.
[extend]
useDefault = true

[allowlist]
description = "Reviewed 2026-11-01: no credentials"
