version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  # Python is left out: its pins need regenerated hash locks (docs/security.md), which Dependabot
  # does not do. pip-audit in security.yml reports vulnerable pins.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/data-setup
    schedule:
      interval: weekly
