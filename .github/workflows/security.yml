name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r platform/requirements-security.lock
      - name: Audit each locked Python environment
        run: |
          for lock in platform/requirements-{ci,dev,ml,news,security}.lock; do
            pip-audit --require-hashes --disable-pip -r "$lock"
          done
      # pip-audit skips direct wheel URLs; check the CPU wheel's upstream version too.
      - name: Audit the CPU PyTorch release
        run: |
          python - <<'PY' > "$RUNNER_TEMP/torch-audit.txt"
          import re
          from pathlib import Path
          source = Path('platform/requirements-ml.in').read_text()
          version = re.search(r'/torch-([0-9.]+)%2Bcpu-', source).group(1)
          print(f'torch=={version}')
          PY
          pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/torch-audit.txt"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz' | sha256sum --check --strict
          mkdir -p gitleaks-bin
          tar -xzf gitleaks.tar.gz -C gitleaks-bin gitleaks
      - name: Scan history without printing secret values
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          args=()
          if [ "$EVENT_NAME" = pull_request ]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            args+=(--log-opts="$BASE_SHA..$HEAD_SHA")
          fi
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --no-banner "${args[@]}" .
