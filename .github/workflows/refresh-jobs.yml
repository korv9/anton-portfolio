name: Refresh job-market data

# JobTech publishes one archive per year, some months after the year ends, and one per
# quarter for the current year. Monthly, this:
#  - counts every ad in any archive from 2020 that is new or changed (the whole job market,
#    ingest_market.py; the counts are cached, so unchanged archives are not downloaded) and
#    rebuilds jobs/market.json;
#  - checks whether a year newer than the IT report's data has appeared; only then does it
#    rebuild that report from every archive (several GB, so it does not run otherwise).
# Cloudflare publishes the site from the commit this makes to main (docs/deploy.md).

on:
  # Paused until the R2 secrets are set and the daily updates are switched on (docs/deploy.md).
  # To resume, uncomment the two lines below. Runs by hand (workflow_dispatch) still work.
  # schedule:
  #   - cron: '23 5 3 * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if no new archive year exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/requirements.txt
      - run: pip install -r platform/requirements.txt
      - name: Restore the whole-market counts
        uses: actions/cache/restore@v4
        with:
          path: warehouse/raw/jobtech/market
          key: jobtech-market-${{ github.run_id }}
          restore-keys: jobtech-market-
      - name: Count new or changed archives (whole job market)
        run: |
          python platform/ingest/jobtech/ingest_market.py
          cd platform
          dbt build --profiles-dir . --select tag:market
          cd ..
          python platform/publish/export_market.py
      - name: Save the whole-market counts
        uses: actions/cache/save@v4
        with:
          path: warehouse/raw/jobtech/market
          key: jobtech-market-${{ github.run_id }}
      - name: Is there a newer archive year?
        id: check
        run: |
          have=$(python -c "import json;print(max(json.load(open('frontend/public/data/gold/marts/jobs.json'))['years']))")
          next=$((have + 1))
          status=$(curl -s -o /dev/null -w '%{http_code}' -I "https://data.arbetsformedlingen.se/annonser/historiska/${next}.jsonl.zip")
          echo "Site has data to $have; archive $next answers $status"
          if [ "$status" = 200 ] || [ "${{ inputs.force }}" = true ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Rebuild from the archives
        if: steps.check.outputs.run == 'true'
        run: |
          python platform/ingest/jobtech/run_history_pipeline.py
          python platform/legacy/build_gold.py
          npm run data:catalog
          npm run data:check
      - name: Commit changed delivery files
        id: commit
        run: |
          git config user.name 'data-refresh[bot]'
          git config user.email 'data-refresh@users.noreply.github.com'
          git add frontend/public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh job market from JobTech archives (run ${GITHUB_RUN_ID})"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
