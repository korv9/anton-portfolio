name: Refresh job-market data

# JobTech publishes one archive per year, some months after the year ends. Monthly, this
# checks whether a year newer than the site's data has appeared; only then does it rebuild
# the report from every archive (several GB, so it does not run otherwise).

on:
  schedule:
    - cron: '23 5 3 * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if no new archive year exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/requirements.txt
      - run: pip install -r platform/requirements.txt
      - name: Is there a newer archive year?
        id: check
        run: |
          have=$(python -c "import json;print(max(json.load(open('frontend/public/data/gold/marts/jobs.json'))['years']))")
          next=$((have + 1))
          status=$(curl -s -o /dev/null -w '%{http_code}' -I "https://data.arbetsformedlingen.se/annonser/historiska/${next}.jsonl.zip")
          echo "Site has data to $have; archive $next answers $status"
          if [ "$status" = 200 ] || [ "${{ inputs.force }}" = true ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Rebuild from the archives
        if: steps.check.outputs.run == 'true'
        run: |
          python platform/ingest/jobtech/run_history_pipeline.py
          python platform/legacy/build_gold.py
          npm run data:catalog
          npm run data:check
      - name: Commit changed delivery files
        id: commit
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name 'data-refresh[bot]'
          git config user.email 'data-refresh@users.noreply.github.com'
          git add frontend/public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: rebuild job market from JobTech archives (run ${GITHUB_RUN_ID})"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
