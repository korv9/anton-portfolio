name: Refresh job-market data

# Daily, each morning:
#  - reads JobTech's stream of new and changed ads since the previous run and counts the ads
#    published each day after the latest archive (ingest_stream.py; preliminary until the
#    quarter's archive is published);
#  - counts every archive from 2020 that is new or changed (the whole job market,
#    ingest_market.py; an unchanged archive is not downloaded), so a new quarterly archive
#    replaces the stream's counts for its months the morning it appears;
#  - rebuilds jobs/market.json, and stores the raw stream files and the counts in R2, where
#    the next run starts from;
#  - checks whether a year newer than the IT report's data has appeared; only then does it
#    rebuild that report from every archive (several GB, so it does not run otherwise).
# Cloudflare publishes the site from the commit this makes to main (docs/deploy.md).

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the IT report even if no new archive year exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # The R2 credentials are secrets of the anton-portfolio environment.
    environment: anton-portfolio
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      PORTFOLIO_RAW: ${{ github.workspace }}/warehouse/raw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Require R2 credentials
        run: |
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set (docs/deploy.md)"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/requirements.txt
      - run: pip install -r platform/requirements.txt
      - name: Start from the stored counts and stream
        run: >-
          python platform/publish/warehouse_store.py pull --only raw
          --path jobtech/market --path jobtech/stream --path jobtech/_manifest.jsonl
      - name: Count new archives and the day's stream
        run: |
          python platform/ingest/jobtech/ingest_market.py
          python platform/ingest/jobtech/ingest_stream.py
          cd platform
          dbt build --profiles-dir . --select tag:market
          cd ..
          python platform/publish/export_market.py
      - name: Store the counts and stream in R2
        if: always()
        run: >-
          python platform/publish/warehouse_store.py push --only raw
          --path jobtech/market --path jobtech/stream --path jobtech/_manifest.jsonl
      - name: Is there a newer archive year?
        id: check
        run: |
          have=$(python -c "import json;print(max(json.load(open('frontend/public/data/gold/marts/jobs.json'))['years']))")
          next=$((have + 1))
          status=$(curl -s -o /dev/null -w '%{http_code}' -I "https://data.arbetsformedlingen.se/annonser/historiska/${next}.jsonl.zip")
          echo "Site has data to $have; archive $next answers $status"
          if [ "$status" = 200 ] || [ "${{ inputs.force }}" = true ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Rebuild from the archives
        if: steps.check.outputs.run == 'true'
        run: |
          python platform/ingest/jobtech/run_history_pipeline.py
          python platform/legacy/build_gold.py
          npm run data:catalog
          npm run data:check
      - name: Commit changed delivery files
        id: commit
        run: |
          git config user.name 'data-refresh[bot]'
          git config user.email 'data-refresh@users.noreply.github.com'
          git add frontend/public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh job market from JobTech (run ${GITHUB_RUN_ID})"
            # main may have moved during the run (a merge, another refresh): put this commit on
            # top of it and push, a few times if needed.
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 15))
            done
            "$pushed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
