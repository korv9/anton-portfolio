name: Refresh job-market data

# Daily, each morning, the market subject of platform/pipeline.yml:
#  - reads JobTech's stream of new and changed ads since the previous run and counts the ads
#    published each day after the latest archive (preliminary until the quarter's archive is
#    published);
#  - counts every archive from 2020 that is new or changed (an unchanged archive is not
#    downloaded), so a new quarterly archive replaces the stream's counts for its months the
#    morning it appears;
#  - rebuilds jobs/market.json, and stores the raw stream files and the counts in R2, where the
#    next run starts from.
# The heavier IT archive report has its own manual workflow. Validated market data is published
# to a versioned R2 group; it does not create a Git commit or rebuild the site.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # The R2 credentials are secrets of the anton-portfolio environment.
    if: github.ref == 'refs/heads/main'
    environment: anton-portfolio
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      PORTFOLIO_RAW: ${{ github.workspace }}/warehouse/raw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
      SCB_API_KEY: ${{ secrets.SCB_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up and start from the stored counts and stream
        id: setup
        uses: ./.github/actions/data-setup
        with:
          pull: market
      - name: Count new archives and the day's stream, build and export
        run: python platform/pipeline.py run market --only ingest,dbt,export
      - name: Store the counts and stream in R2
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: python platform/pipeline.py push market
      - name: Validate complete daily coverage and publish
        run: python platform/pipeline.py run market --only publish
