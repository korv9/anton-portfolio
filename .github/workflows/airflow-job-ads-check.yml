name: Check the Airflow job ads flow

# Manual, and on a push that changes the stack or the flow. Starts infra/airflow/docker-compose.yml on a runner, lets Airflow schedule
# job_ads_near_realtime every ten minutes for a while, restarts the stack to show that the metadata
# persists, and keeps the evidence as an artifact (docs/job-ads-airflow.md). It reads the job
# assistant's store and the current cluster model's reference vectors from the bucket's public address,
# so it needs no secrets, and writes nothing back: JOB_ADS_PUBLISH stays local, so the files are checked
# but not uploaded, and nothing is deployed.

on:
  push:
    paths:
      - infra/airflow/**
      - platform/job_assistant/realtime.py
      - .github/workflows/airflow-job-ads-check.yml
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes Airflow schedules before the restart
        default: '25'

permissions:
  contents: read

jobs:
  airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The r2.dev address: the custom domain's bot protection answers runners with 403.
      PUBLIC: https://pub-9867b18896ba49e4a0b4a3d2f39c0385.r2.dev/
      MINUTES: ${{ inputs.minutes || '25' }}
      COMPOSE: docker compose -f infra/airflow/docker-compose.yml
      EVIDENCE: ${{ github.workspace }}/tmp/airflow-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the ad store and the current model's reference vectors
        run: |
          run=$(python3 -c "import json; print(json.load(open('ml/jobs/registry.json'))['current'])")
          for key in raw/job_assistant/ads.json raw/job_assistant/state.json raw/job_assistant/runs.jsonl                      features/job_clusters/reference-$run.npz; do
            curl -fsS --create-dirs -o "warehouse/$key" "${PUBLIC%/}/warehouse/$key"
          done
      - name: Build and start Airflow
        run: |
          printf 'AIRFLOW_UID=%s\nAIRFLOW_JWT_SECRET=%s\n' "$(id -u)" "$(openssl rand -hex 32)" > infra/airflow/.env
          $COMPOSE build
          $COMPOSE up -d
      - name: Unpause the DAG and let Airflow schedule it
        run: |
          until $COMPOSE exec -T airflow-scheduler airflow dags list 2>/dev/null | grep -q job_ads_near_realtime; do sleep 10; done
          $COMPOSE exec -T airflow-scheduler airflow dags unpause job_ads_near_realtime
          sleep $(( MINUTES * 60 ))
      - name: Restart the stack; the metadata is on the airflow-db volume
        run: |
          mkdir -p "$EVIDENCE"
          $COMPOSE exec -T airflow-scheduler airflow dags list-runs job_ads_near_realtime -o json > "$EVIDENCE/runs-before.json"
          docker stats --no-stream > "$EVIDENCE/docker-stats.txt"
          $COMPOSE down
          $COMPOSE up -d
          # Wait for one more scheduled run to finish after the restart.
          n=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))))" "$EVIDENCE/runs-before.json")
          for i in $(seq 1 90); do
            $COMPOSE exec -T airflow-scheduler airflow dags list-runs job_ads_near_realtime -o json > "$EVIDENCE/runs-after.json" 2>/dev/null || true
            python3 - "$EVIDENCE/runs-after.json" "$n" <<'EOF' && break
          import json, sys
          runs = json.load(open(sys.argv[1]))
          done = [r for r in runs if r["state"] in ("success", "failed")]
          sys.exit(0 if len(done) > int(sys.argv[2]) else 1)
          EOF
            sleep 20
          done
      - name: Collect the evidence
        if: always()
        run: |
          mkdir -p "$EVIDENCE"
          for id in $(python3 -c "import json,sys; print(' '.join(r['run_id'] for r in json.load(open(sys.argv[1]))))" "$EVIDENCE/runs-after.json"); do
            name=$(echo "tasks-$id.json" | tr ':+' '__')
            $COMPOSE exec -T airflow-scheduler airflow tasks states-for-dag-run job_ads_near_realtime "$id" -o json > "$EVIDENCE/$name" || true
          done
          cp warehouse/raw/job_assistant/pipeline.json warehouse/raw/job_assistant/realtime_runs.jsonl "$EVIDENCE/" || true
          $COMPOSE logs --no-color > "$EVIDENCE/compose.log" 2>&1 || true
          python3 infra/airflow/check_runs.py "$EVIDENCE" | tee "$EVIDENCE/check.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: airflow-evidence
          path: tmp/airflow-evidence
          retention-days: 14
      - name: Stop Airflow
        if: always()
        run: $COMPOSE down -v
