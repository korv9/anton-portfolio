name: Run a heavy compute job

# Model fits and clustering sweeps that need more memory than a laptop has, by hand only. A job
# pulls its inputs from the warehouse store in R2 (platform/publish/warehouse_store.py), runs, and
# pushes its outputs back under the same features folder. It publishes nothing to the site.
#
#   futures-topics  the SWEDEN E topic pilot (docs/sweden-futures-topics-preregistration.md):
#                   cluster, analyze, then a scratch dbt build and export_futures_topics.py whose
#                   topics.json is kept as an artifact for review.
#   module          python -m <module> <arguments>, <module> under ml., with <path> of the <tree>
#                   (features, or raw for a source corpus) pulled before and pushed after, so a
#                   later batch needs no change here. The job-ad corpus behind Cluster Lab:
#                   tree raw, path jobtech/cluster-corpus,
#                   args ml.cluster_lab.cli prepare --config configs/cluster_lab/jobs_corpus.yaml
#   experiments     the clustering experiments (docs/cluster-experiments.md), args '<domain> <step[,step]>',
#                   domain philosophy|symbolic|jobs|debates, steps select|final|export, and an
#                   optional third word repro[:label] for a from-scratch refit in separate folders. It pulls the
#                   warehouse, the shared features/experiments folder (registry, embeddings,
#                   checkpoints; no source text) and the domain's source files, rebuilds the local
#                   text table with `prepare`, runs the step with a deadline 30 minutes inside the
#                   run step's limit, and pushes features/experiments back, after a failure too,
#                   so the next dispatch resumes from the checkpoints. All experiment dispatches
#                   share one concurrency group, so two never write the registry at once.
#
# The run step stops at 300 minutes, so the push has its own window before the job limit. After a
# failure or that timeout only the checkpoints are pushed (futures-topics: run/), so the next run
# resumes; the derived outputs are pushed only after a run that succeeded. A cancelled run or a
# runner that dies pushes nothing.

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        options: [futures-topics, module, experiments]
        default: futures-topics
      args:
        description: 'module: the module and its arguments, e.g. ml.cluster_lab.cli run --new-runs 1; experiments: <domain> <step>, e.g. philosophy select'
        default: ''
      path:
        description: 'module only: folder of the tree to pull before and push after, e.g. clusters/eras'
        default: ''
      tree:
        description: 'module only: the stored tree that path is in'
        type: choice
        options: [features, raw]
        default: features

permissions:
  contents: read

concurrency:
  group: cluster-jobs-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.ref == 'refs/heads/main'
    environment: anton-portfolio
    env:
      JOB: ${{ inputs.job }}
      ARGS: ${{ inputs.args }}
      TREE: ${{ inputs.job == 'module' && inputs.tree || 'features' }}
      PULL: ${{ inputs.job == 'futures-topics' && 'sweden/futures_topics/run' || inputs.job == 'experiments' && 'experiments' || inputs.path }}
      PUSH: ${{ inputs.job == 'futures-topics' && 'sweden/futures_topics' || inputs.job == 'experiments' && 'experiments' || inputs.path }}
      CHECKPOINTS: ${{ inputs.job == 'futures-topics' && 'sweden/futures_topics/run' || inputs.job == 'experiments' && 'experiments' || inputs.path }}
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      PORTFOLIO_DB: ${{ github.workspace }}/warehouse/portfolio.duckdb
      PORTFOLIO_FEATURES: ${{ github.workspace }}/warehouse/features
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python and the ML lock
        uses: ./.github/actions/data-setup
        timeout-minutes: 20
        # The R2 keys go only to the steps that talk to the bucket, never to the run step.
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        with:
          ml: 'true'
      # The module and the path come from the dispatch form, so only a module of the ml package and a
      # plain features folder are accepted. The R2 keys are never in the run step's environment.
      - name: Check the inputs
        id: check
        shell: bash
        run: |
          if [ "$JOB" = module ]; then
            read -ra parts <<< "$ARGS"
            if ! [[ "${parts[0]:-}" =~ ^ml\.[a-z0-9_.]+$ ]]; then
              echo "::error::module must be an ml. module, e.g. ml.cluster_lab.cli"; exit 1
            fi
          fi
          if [ "$JOB" = experiments ]; then
            read -ra parts <<< "$ARGS"
            if ! [[ "${parts[0]:-}" =~ ^(philosophy|symbolic|jobs|debates)$ ]] || ! [[ "${parts[1]:-}" =~ ^(select|final|export)(,(select|final|export))*$ ]] || ! [[ "${parts[2]:-}" =~ ^(repro(:[A-Za-z0-9_-]+)?)?$ ]]; then
              echo "::error::experiments args are '<philosophy|symbolic|jobs|debates> <step[,step]> [repro[:label]]', steps select, final, export"; exit 1
            fi
          fi
          if [ -n "$PUSH" ] && ! [[ "$PUSH" =~ ^[a-z0-9_-]+(/[a-z0-9_-]+)*$ ]]; then
            echo "::error::path must be a folder of a-z, 0-9, _ and -, e.g. clusters/eras"; exit 1
          fi
          if [ "$TREE" != features ] && [ "$TREE" != raw ]; then
            echo "::error::tree must be features or raw"; exit 1
          fi
      - name: Pull the inputs
        id: pull
        if: env.PULL != ''
        timeout-minutes: 15
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python platform/publish/warehouse_store.py pull --only "$TREE" --path "$PULL"
          if [ "$JOB" = experiments ]; then
            # The domain's sources: the warehouse holds the passages and occurrences; Replik's
            # passages are in the stored Cluster Lab runs and the job ads in the job-assistant store.
            python platform/publish/warehouse_store.py pull --only db
            case "${ARGS%% *}" in
              debates) python platform/publish/warehouse_store.py pull --only cluster_lab ;;
              jobs) python platform/publish/warehouse_store.py pull --only raw --path job_assistant ;;
            esac
          fi
      - name: Run
        id: run
        timeout-minutes: 265
        # Named so that pipefail is on: a failed step is not hidden behind tee.
        shell: bash
        run: |
          mkdir -p logs
          case "$JOB" in
            futures-topics)
              python -m ml.futures_topics.cluster 2>&1 | tee logs/cluster.log
              python -m ml.futures_topics.analyze 2>&1 | tee logs/analyze.log
              (cd platform && python -m dbt.cli.main build --profiles-dir . \
                --select stg_futures_topics+ stg_futures_topic_cells+ stg_futures_topic_clusters+) 2>&1 | tee logs/dbt.log
              python platform/publish/sweden/export_futures_topics.py 2>&1 | tee logs/export.log
              ;;
            module)
              # Split on white space into the module and its arguments, each passed as one word.
              read -ra parts <<< "$ARGS"
              python -m "${parts[0]}" "${parts[@]:1}" 2>&1 | tee logs/module.log
              ;;
            experiments)
              read -ra parts <<< "$ARGS"
              # A third word 'repro' (or 'repro:<label>') refits from scratch under experiments/repro/<label>
              # (registry.EXPERIMENTS): own registry, checkpoints, embeddings and exports, so the runner's
              # time and memory are measured and stored results stay. A re-run keeps the run id, so it resumes.
              case "${parts[2]:-}" in
                repro) export EXPERIMENTS_REPRO="$GITHUB_RUN_ID" ;;
                repro:*) export EXPERIMENTS_REPRO="${parts[2]#repro:}" ;;
              esac
              # GNU time records the peak resident memory of each step (largest single process).
              timed() { if [ -x /usr/bin/time ]; then /usr/bin/time -v -o "logs/time-$1.txt" "${@:2}"; else "${@:2}"; fi; }
              # Prepare and the steps share one budget of 255 minutes, inside the step's 265.
              started=$(date +%s)
              timed prepare python -m "ml.experiments.${parts[0]}" prepare 2>&1 | tee logs/prepare.log
              IFS=, read -ra steps <<< "${parts[1]}"
              for step in "${steps[@]}"; do
                left=$(( 255 - ($(date +%s) - started) / 60 ))
                timed "$step" python -m "ml.experiments.${parts[0]}" "$step" --deadline-minutes "$left" 2>&1 | tee "logs/step-$step.log"
              done
              grep -H -E 'Maximum resident|Elapsed \(wall' logs/time-*.txt || true
              ;;
          esac
      # After a failure too, so the checkpoints of a stopped run are kept for the next one
      # (futures-topics and features only; a failed raw rebuild pushes nothing).
      - name: Push the outputs
        if: ${{ always() && env.PUSH != '' && steps.check.outcome == 'success' && (env.PULL == '' || steps.pull.outcome == 'success') }}
        # The job-ad corpus is about 2.4 GB.
        timeout-minutes: 45
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          folder="$PUSH"
          if [ "$RUN_OUTCOME" != success ]; then
            # A failed raw rebuild would overwrite good stored files with partial ones.
            if [ "$TREE" = raw ]; then echo "Run failed: raw files are not pushed."; exit 0; fi
            folder="$CHECKPOINTS"
          fi
          python platform/publish/warehouse_store.py push --only "$TREE" --path "$folder"
      # Logs and diagnostics only. The review sheet (tmp/topics-review.csv) quotes sentences and stays out.
      - name: Keep the logs and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.job }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            logs/
            warehouse/features/sweden/futures_topics/run/metrics.json
            warehouse/features/sweden/futures_topics/run/cache/*/sweep.parquet
            warehouse/features/sweden/futures_topics/method.json
            warehouse/features/experiments/registry/*/registry.json
            frontend/public/data/cluster-experiments/
            frontend/public/data/sweden/futures/topics.json
