name: Build, store and publish the warehouse

# Weekly, and by hand: every subject of platform/pipeline.yml that is not marked manual, from the
# public sources to the R2 release. The whole DuckDB warehouse is stored in R2 with every raw file it
# was built from and the ML stages' outputs (src/portfolio/storage/warehouse_store.py), and each
# delivery group whose subjects all came through is validated and published. Nothing is
# committed. Fetching runs in parallel lanes, one job each, that store what they fetched even
# when they fail; the build job then builds every subject from the stored files. A run starts
# from the raw files already stored, so what is still fresh is not downloaded again.
#
# Afterwards the bucket holds warehouse/portfolio.duckdb.gz, warehouse/manifest.json,
# warehouse/raw/ and warehouse/features/. Fetch them anywhere with:
#     python -m portfolio.storage.warehouse_store pull

on:
  # Saturday evening: the run must be done before the daily
  # refreshes queue behind it on Sunday morning (they share the data-refresh lock).
  schedule:
    - cron: '13 21 * * 6'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Refetch public-source history as well as current data
        type: boolean
        default: false
      ml:
        description: >-
          ML stages (embeddings, maps, concept layer): 'missing' runs a stage only when its
          stored output is absent, 'stale' also when its inputs changed, 'always' reruns every
          stage. Seeds are fixed, so a rerun on the same inputs gives the same results.
        type: choice
        options: [missing, stale, always]
        default: missing

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false
  # Wait in order: the default keeps one pending run and cancels the one before it.
  queue: max

jobs:
  # The ingest lanes (platform/pipeline_lanes.py): subjects that write the same raw source share one.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: lanes
        run: |
          pip install --quiet pyyaml
          # On its own line so a failure stops the job: inside echo it left an empty matrix.
          lanes=$(python platform/pipeline_lanes.py)
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"

  # One job per lane, in parallel. A source that stalls stops only its own lane, and the lane
  # stores what it fetched even when its ingest failed or timed out, so the next run resumes:
  # stored files that are still fresh are reused, not fetched again.
  ingest:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout }}
    environment: anton-portfolio
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.lanes) }}
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      PORTFOLIO_FULL_REFRESH: ${{ inputs.full_refresh && '1' || '0' }}
      PORTFOLIO_DB: ${{ github.workspace }}/warehouse/portfolio.duckdb
      PORTFOLIO_RAW: ${{ github.workspace }}/warehouse/raw
      PORTFOLIO_FEATURES: ${{ github.workspace }}/warehouse/features
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
      SUBJECTS: ${{ matrix.subjects }}
      LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up and start from the lane's stored raw and feature files
        id: setup
        uses: ./.github/actions/data-setup
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        with:
          pull: ${{ matrix.subjects }}
      # Stops before the job does, so the store below always has time to run.
      - name: Fetch the lane's subjects
        timeout-minutes: ${{ matrix.timeout }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        # Unquoted on purpose: one argument per subject.
        run: python platform/pipeline.py run $SUBJECTS --only ingest --results "tmp/lanes/ingest-$LANE.json"
      - name: Store what the lane fetched, whatever the outcome
        if: ${{ always() && steps.setup.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python platform/pipeline.py push $SUBJECTS
      - name: Hand the outcome to the build
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingest-${{ matrix.lane }}
          path: tmp/lanes/
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: ingest
    runs-on: ubuntu-latest
    # Runs when lanes failed: their subjects count as failed, and the others build and publish.
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.ingest.result != 'skipped' }}
    timeout-minutes: 150
    # The R2 credentials are secrets of the anton-portfolio environment.
    environment: anton-portfolio
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      PORTFOLIO_FULL_REFRESH: ${{ inputs.full_refresh && '1' || '0' }}
      PORTFOLIO_DB: ${{ github.workspace }}/warehouse/portfolio.duckdb
      PORTFOLIO_RAW: ${{ github.workspace }}/warehouse/raw
      PORTFOLIO_FEATURES: ${{ github.workspace }}/warehouse/features
      # The schedule has no inputs: it recomputes a stage when its corpus changed.
      ML: ${{ inputs.ml || 'stale' }}
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up and start from the stored raw files and ML outputs
        id: setup
        uses: ./.github/actions/data-setup
        # The R2 keys go only to the steps that talk to the bucket. Every step after the checkout
        # does: the build records each ingestion in R2 (platform/publish/ingest_status.py) and
        # syncs the news archive there.
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        with:
          pull: --all
          ml: 'true'
      - name: Collect the lanes' outcomes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ingest-*
          path: tmp/lanes
          merge-multiple: true
      # Lane subjects only build here; news and quality also ingest here (pipeline_lanes.py).
      # One failed subject does not stop the others; the step fails if any did.
      - name: Build and test every subject
        id: build
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python platform/pipeline.py run --all --only ingest,dbt,ml --ml "$ML" --ingest-results tmp/lanes
      # Only a complete build replaces the stored warehouse.
      - name: Store the warehouse, raw files and ML outputs in R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python platform/pipeline.py push --all
      # After the store, so the data is kept whatever the result. A subject that did not build
      # is not exported, and its group is not published; the other groups are. The quality
      # subject ends with the structural gate (gate: true in platform/quality/quality_registry.yml).
      - name: Export, check and publish each complete group
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python platform/pipeline.py run --all --only export,publish
      # Under the same writer lock, whatever this build did: each group keeps its active release
      # and the two previous approved ones (docs/platform/r2-delivery-contract.md). A dry run whose plan
      # lands in the step summary, until the repository variable RETENTION_APPLY is 'true'.
      - name: Plan or delete superseded releases
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          APPLY: ${{ vars.RETENTION_APPLY == 'true' && '--apply' || '' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          plan=$(python -m portfolio.publish.retention $APPLY)
          { echo '### Release retention'; echo '```json'; echo "$plan"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # A failed or timed-out run opens (or comments on) an issue; a successful one closes it.
  alert:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/failure-issue
        with:
          result: ${{ needs.build.result }}
