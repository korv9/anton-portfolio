name: Build and store the warehouse

# Builds the whole DuckDB warehouse from the public sources and stores it in R2, together with
# every raw file it was built from (platform/publish/warehouse_store.py). Run by hand; nothing is
# committed. A run starts from the raw files already stored, so closed parliamentary sessions
# and archives that have not changed are not downloaded again.
#
# Afterwards the bucket holds warehouse/portfolio.duckdb.gz, warehouse/manifest.json,
# warehouse/raw/ and warehouse/features/ (the ML stages' outputs). Fetch them anywhere with:
#     python platform/publish/warehouse_store.py pull

on:
  workflow_dispatch:
    inputs:
      ml:
        description: >-
          ML stages (embeddings, maps, concept layer): 'missing' runs a stage only when its
          stored output is absent, 'always' reruns every stage. Seeds are fixed, so a rerun on
          the same inputs gives the same results.
        type: choice
        options: [missing, always]
        default: missing

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The first run counts every JobTech archive for the AI governance terms (about 90 minutes);
    # later runs skip unchanged archives.
    timeout-minutes: 300
    # The R2 credentials are secrets of the anton-portfolio environment.
    environment: anton-portfolio
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      PORTFOLIO_DB: ${{ github.workspace }}/warehouse/portfolio.duckdb
      PORTFOLIO_RAW: ${{ github.workspace }}/warehouse/raw
      PORTFOLIO_FEATURES: ${{ github.workspace }}/warehouse/features
      ML: ${{ inputs.ml || 'missing' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Require R2 credentials
        run: |
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set (docs/deploy.md)"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/requirements.txt
      - run: pip install -r platform/requirements.txt
      - name: Start from the stored raw files and ML outputs
        run: |
          python platform/publish/warehouse_store.py pull --only raw
          python platform/publish/warehouse_store.py pull --only features
      - name: Welfare (SCB, FoHM, Försäkringskassan, ESS, Kolada)
        run: python platform/ingest/run_welfare.py
      - name: Parliament (roll calls, bills, studies, elections)
        run: python platform/ingest/run_parliament.py
      - name: Taxes
        run: python platform/ingest/run_taxes.py
      - name: Job market (JobTech archives and daily stream, counted)
        run: |
          python platform/ingest/jobtech/ingest_market.py
          python platform/ingest/jobtech/ingest_stream.py
          cd platform && dbt build --profiles-dir . --select tag:market
      - name: News (archive on R2, tagged)
        run: |
          python platform/ingest/news/news_ingest.py --sync --months 3
          python platform/ingest/news/people_ingest.py
          cd platform && dbt build --profiles-dir . --select tag:news
      - name: Politics
        working-directory: platform
        run: dbt build --profiles-dir . --select +tag:politics --target-path target/politics
      - name: EU AI Act (Cellar, Commission guidance)
        run: |
          python platform/ingest/eu_ai_act/run.py
          cd platform && dbt build --profiles-dir . --select tag:ai_act
      - name: ML dependencies (CPU PyTorch, sentence-transformers, UMAP)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r platform/requirements-symbolic.txt
      # assert_concept_link_targets_exist checks links into philosophy, Riksdag and job-ad
      # models; it runs in the concept-layer step, once all of them are built.
      - name: Riksdag speeches and AI (dictionary, similarity to the Act)
        run: |
          python platform/ingest/riksdagen/ingest_speeches.py
          (cd platform && dbt build --profiles-dir . --select tag:ai_politics --exclude mart_ai_act_speech_similarity assert_concept_link_targets_exist)
          if [ "$ML" = always ] || [ ! -f warehouse/features/ai_politics/run.json ]; then
            python platform/nlp/ai_politics/similarity.py
          fi
          cd platform && dbt build --profiles-dir . --select mart_ai_act_speech_similarity
      - name: Symbolic Atlas (Gutenberg corpus, embeddings, map)
        run: |
          python platform/ingest/symbolic/ingest_corpus.py
          (cd platform && dbt build --profiles-dir . --select tag:symbolic --exclude path:models/gold/symbolic)
          if [ "$ML" = always ] || [ ! -f warehouse/features/symbolic/run.json ]; then
            python platform/nlp/symbolic/pipeline.py
          fi
          cd platform && dbt build --profiles-dir . --select path:models/gold/symbolic
      - name: Philosophy Atlas (Gutenberg corpus, embeddings, maps, tensions)
        run: |
          python platform/ingest/philosophy/ingest_corpus.py
          (cd platform && dbt build --profiles-dir . --select tag:philosophy --exclude path:models/gold/philosophy assert_concept_link_targets_exist)
          if [ "$ML" = always ] || [ ! -f warehouse/features/philosophy/run.json ]; then
            python platform/nlp/philosophy/pipeline.py
          fi
          cd platform && dbt build --profiles-dir . --select path:models/gold/philosophy --exclude assert_concept_link_targets_exist
      - name: AI governance in job ads (JobTech archives, counted)
        run: |
          python platform/ingest/jobtech/ingest_governance_terms.py
          cd platform && dbt build --profiles-dir . --select tag:job_ai_governance --exclude assert_concept_link_targets_exist
      - name: Concept layer (four corpora, curated concepts)
        run: |
          if [ "$ML" = always ] || [ ! -f warehouse/features/concepts/run.json ]; then
            python platform/nlp/concepts/build.py
          fi
          cd platform && dbt build --profiles-dir . --select tag:concepts
      - name: AI governance timeline (cross-domain)
        working-directory: platform
        run: dbt build --profiles-dir . --select tag:cross_domain
      - name: Quality and validity (registered checks, dbt tests, diagnostics)
        run: |
          python platform/quality/evaluate.py
          cd platform && dbt build --profiles-dir . --select tag:quality
      - name: Store the warehouse, raw files and ML outputs in R2
        run: |
          python platform/publish/warehouse_store.py push
          python platform/publish/warehouse_store.py status
      # After the store, so the data is kept whatever the result: fail the run if a structural
      # check (gate: true in platform/quality/quality_registry.yml) failed. Validity diagnostics
      # never block a run.
      - name: Quality gate (structural checks)
        run: python platform/quality/evaluate.py --dbt-results platform/target/quality/run_results.json --gate
