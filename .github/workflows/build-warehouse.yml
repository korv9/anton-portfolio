name: Build, store and publish the warehouse

# Weekly, and by hand: every subject of platform/pipeline.yml that is not marked manual, from the
# public sources to the site. The whole DuckDB warehouse is stored in R2 with every raw file it
# was built from and the ML stages' outputs (platform/publish/warehouse_store.py), and each
# delivery group whose subjects all came through is validated and published. Nothing is
# committed. A run starts from the raw files already stored, so closed parliamentary sessions and
# archives that have not changed are not downloaded again.
#
# Afterwards the bucket holds warehouse/portfolio.duckdb.gz, warehouse/manifest.json,
# warehouse/raw/ and warehouse/features/. Fetch them anywhere with:
#     python platform/publish/warehouse_store.py pull

on:
  # Saturday evening: the run may take its whole timeout and must be done before the daily
  # refreshes queue behind it on Sunday morning (they share the data-refresh lock).
  schedule:
    - cron: '13 21 * * 6'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Refetch public-source history as well as current data
        type: boolean
        default: false
      ml:
        description: >-
          ML stages (embeddings, maps, concept layer): 'missing' runs a stage only when its
          stored output is absent, 'stale' also when its inputs changed, 'always' reruns every
          stage. Seeds are fixed, so a rerun on the same inputs gives the same results.
        type: choice
        options: [missing, stale, always]
        default: missing

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The first run counts every JobTech archive for the AI governance terms (about 90 minutes);
    # later runs skip unchanged archives.
    timeout-minutes: 300
    # The R2 credentials are secrets of the anton-portfolio environment.
    environment: anton-portfolio
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      PORTFOLIO_FULL_REFRESH: ${{ inputs.full_refresh && '1' || '0' }}
      PORTFOLIO_DB: ${{ github.workspace }}/warehouse/portfolio.duckdb
      PORTFOLIO_RAW: ${{ github.workspace }}/warehouse/raw
      PORTFOLIO_FEATURES: ${{ github.workspace }}/warehouse/features
      # The schedule has no inputs: it recomputes a stage when its corpus changed.
      ML: ${{ inputs.ml || 'stale' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up and start from the stored raw files and ML outputs
        id: setup
        uses: ./.github/actions/data-setup
        with:
          pull: --all
          ml: 'true'
      # One failed subject does not stop the others; the step fails if any did.
      - name: Fetch, build and test every subject
        id: build
        run: python platform/pipeline.py run --all --only ingest,dbt,ml --ml "$ML"
      # Only a complete build replaces the stored warehouse.
      - name: Store the warehouse, raw files and ML outputs in R2
        run: python platform/pipeline.py push --all
      - name: Save public-source checkpoints after a failed build
        if: ${{ failure() && steps.setup.outcome == 'success' }}
        run: |
          python platform/pipeline.py push welfare parliament taxes
          python platform/pipeline.py push ai_politics --only raw
      # After the store, so the data is kept whatever the result. A subject that did not build
      # is not exported, and its group is not published; the other groups are. The quality
      # subject ends with the structural gate (gate: true in platform/quality/quality_registry.yml).
      - name: Export, check and publish each complete group
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python platform/pipeline.py run --all --only export,publish
