name: Rebuild the historical IT job report

# Heavy archive work runs independently of the daily whole-market delivery: the jobs_analysis
# subject of platform/pipeline.yml, published as its own group.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.ref == 'refs/heads/main'
    environment: anton-portfolio
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/data-setup
      - name: Rebuild, validate and publish the report without changing daily market data
        run: python platform/pipeline.py run jobs_analysis
