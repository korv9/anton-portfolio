name: Rebuild the historical IT job report

# Heavy archive work runs independently of the daily whole-market delivery: the jobs_analysis
# subject of platform/pipeline.yml, published as its own group.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false
  # Wait in order: the default keeps one pending run and cancels the one before it.
  queue: max

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.ref == 'refs/heads/main'
    environment: anton-portfolio
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/data-setup
      - name: Rebuild, validate and publish the report without changing daily market data
        run: python platform/pipeline.py run jobs_analysis

  # A failed or timed-out run opens (or comments on) an issue; a successful one closes it.
  alert:
    needs: report
    if: ${{ !cancelled() && needs.report.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/failure-issue
        with:
          result: ${{ needs.report.result }}
