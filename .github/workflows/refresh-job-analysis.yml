name: Rebuild the historical IT job report

# Heavy archive work runs independently of the daily whole-market delivery.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: anton-portfolio
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
    steps:
      - name: Require R2 credentials
        run: |
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            value="${!name}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            export "$name=$value"
            [ -n "${!name}" ] || { echo "::error::Secret $name is not set"; exit 1; }
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r platform/requirements.txt
      - name: Rebuild and validate the report
        run: |
          python platform/ingest/jobtech/run_history_pipeline.py
          python platform/legacy/build_gold.py
          npm run data:catalog
          npm run data:check
      - name: Publish the report without changing daily market data
        run: |
          python platform/publish/release.py materialize --root frontend/public/data \
            --spec configs/delivery/jobs-analysis.json --catalog frontend/public/data/catalog.json
          python platform/publish/release.py publish --group jobs-analysis --root frontend/public/data \
            --spec configs/delivery/jobs-analysis.json --code-sha "$GITHUB_SHA"
