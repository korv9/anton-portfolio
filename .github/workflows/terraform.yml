name: Terraform

# infra/: format, validate and plan both stacks on pull requests that touch them. A plan needs
# the state and provider credentials (infra/README.md); without them, as on forks, it is skipped.
# Apply runs only by hand, from main, in the protected `terraform` environment.

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - 'platform/publish/r2-cors.json'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      stack:
        description: Stack under infra/
        type: choice
        options: [cloudflare, github]
        default: cloudflare
      apply:
        description: Apply the plan (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_worker_domain_ids: ${{ vars.TF_WORKER_DOMAIN_IDS }}

jobs:
  plan:
    name: Plan (${{ matrix.stack }})
    if: github.event_name == 'pull_request' || !inputs.apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stack: [cloudflare, github]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    env:
      # Each stack gets only its own provider token.
      CLOUDFLARE_API_TOKEN: ${{ matrix.stack == 'cloudflare' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      GITHUB_TOKEN: ${{ matrix.stack == 'github' && secrets.TF_GITHUB_TOKEN || '' }}
      HAS_CREDENTIALS: ${{ secrets.TF_STATE_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -input=false -backend=false
      - run: terraform validate -no-color
      - name: Plan against the stored state
        if: env.HAS_CREDENTIALS == 'true'
        env:
          STACK: ${{ matrix.stack }}
        run: |
          terraform init -input=false -reconfigure
          terraform plan -input=false -no-color -lock-timeout=60s -out=tfplan
          {
            echo "### Terraform plan: $STACK"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Note the skipped plan
        if: env.HAS_CREDENTIALS != 'true'
        run: echo 'Plan skipped, no state credentials in this run.' >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply (${{ inputs.stack }})
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: terraform
    defaults:
      run:
        working-directory: infra/${{ inputs.stack }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ inputs.stack == 'cloudflare' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      GITHUB_TOKEN: ${{ inputs.stack == 'github' && secrets.TF_GITHUB_TOKEN || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - run: terraform init -input=false
      - name: Plan, record and apply exactly that plan
        env:
          STACK: ${{ inputs.stack }}
        run: |
          terraform plan -input=false -no-color -lock-timeout=60s -out=tfplan
          {
            echo "### Terraform apply: $STACK"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          terraform apply -input=false -no-color -lock-timeout=60s tfplan
