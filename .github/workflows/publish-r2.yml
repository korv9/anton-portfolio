name: Bootstrap versioned data delivery in R2

# Stage and verify a complete bundle before switching the single live pointer.

on:
  workflow_dispatch:
    inputs:
      manifest_key:
        description: Active manifest (use manifests/pipeline-smoke.json for verification)
        type: string
        default: manifests/current.json
      source_manifest_key:
        description: Verified source for missing groups (for promotion use manifests/pipeline-smoke.json)
        type: string
        default: manifests/current.json

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false
  # Wait in order: the default keeps one pending run and cancels the one before it.
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The R2 credentials are secrets of the anton-portfolio environment.
    if: github.ref == 'refs/heads/main'
    environment: anton-portfolio
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      # Either name for the secret key; the environment holds it as R2_SECRET_ACCESS_KEY_ID.
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
      MANIFEST_KEY: ${{ inputs.manifest_key || 'manifests/current.json' }}
      SOURCE_MANIFEST_KEY: ${{ inputs.source_manifest_key || 'manifests/current.json' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/data-setup
      - name: Materialize and stage all available publication groups
        run: |
          : > "$RUNNER_TEMP/release-bundle.tsv"
          for group in baseline jobs jobs-analysis news public-data diva; do
            existing=$(python platform/publish/release.py current --group "$group" \
              --manifest-key manifests/current.json | python -c "import json,sys; print(json.load(sys.stdin)['release'] or '')")
            if [ -z "$existing" ] && [ "${SOURCE_MANIFEST_KEY:-manifests/current.json}" != manifests/current.json ]; then
              existing=$(python platform/publish/release.py current --group "$group" \
                --manifest-key "$SOURCE_MANIFEST_KEY" | python -c "import json,sys; print(json.load(sys.stdin)['release'] or '')")
            fi
            if [ -n "$existing" ]; then
              printf '%s\t%s\n' "$group" "$existing" >> "$RUNNER_TEMP/release-bundle.tsv"
              continue
            fi
            if [ "$group" = diva ] && ! python -c "import json,pathlib,sys; p=pathlib.Path('frontend/public/data'); c=json.load(open(p/'catalog.json')); sys.exit(0 if (p/'diva/clusters.json').exists() or any(f['path']=='diva/clusters.json' for f in c['files']) else 1)"; then
              echo "No DiVA export exists; its independent manual workflow can add that group later."
              continue
            fi
            python platform/publish/release.py materialize --root frontend/public/data \
              --spec "configs/delivery/$group.json" --catalog frontend/public/data/catalog.json \
              --prefer-active
            python platform/publish/release.py publish --stage-only --group "$group" \
              --root frontend/public/data --spec "configs/delivery/$group.json" \
              --code-sha "$GITHUB_SHA" --manifest-key "${MANIFEST_KEY:-manifests/current.json}" \
              > "$RUNNER_TEMP/release-$group.log"
            release=$(tail -n 1 "$RUNNER_TEMP/release-$group.log" | python -c "import json,sys; print(json.load(sys.stdin)['release'])")
            printf '%s\t%s\n' "$group" "$release" >> "$RUNNER_TEMP/release-bundle.tsv"
          done
      - name: Activate the verified complete bundle
        run: |
          choices=()
          while IFS=$'\t' read -r group release; do
            choices+=(--release "$group=$release")
          done < "$RUNNER_TEMP/release-bundle.tsv"
          python platform/publish/release.py activate "${choices[@]}" \
            --manifest-key "${MANIFEST_KEY:-manifests/current.json}"
      - name: Keep publication receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-release-receipts
          path: |
            ${{ runner.temp }}/release-*.log
            ${{ runner.temp }}/release-bundle.tsv
          if-no-files-found: ignore
          retention-days: 30

  # A failed or timed-out run opens (or comments on) an issue; a successful one closes it.
  alert:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/failure-issue
        with:
          result: ${{ needs.publish.result }}
