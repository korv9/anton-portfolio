name: GitHub status snapshot

# Every hour: the workflows and their newest runs, the scheduled runs of the last 30 days, the
# failure issues, the postmortems in docs/incidents and the Fabric replay log, written once with
# this workflow's token to status/github.json in R2 (platform/publish/github_status.py). The
# platform page reads that file instead of calling the GitHub API from every visitor's browser.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: github-status
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    # The R2 credentials are secrets of the anton-portfolio environment.
    environment: anton-portfolio
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/requirements-ci.lock
      - run: pip install --require-hashes -r platform/requirements-ci.lock
      - name: Snapshot and publish status/github.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python platform/publish/github_status.py
