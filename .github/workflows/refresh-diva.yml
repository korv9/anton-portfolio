name: Harvest DiVA theses and cluster their topics

# Student theses from DiVA (diva-portal.org) over OAI-PMH, then topic clusters for the site: the
# diva subject of platform/pipeline.yml. Runs by hand only. The harvested months are stored in R2
# with the other raw files, so a later run only fetches new months. The cluster file is validated
# and published as its own R2 group.

on:
  workflow_dispatch:
    inputs:
      from:
        description: First month (YYYY-MM)
        default: '2023-01'
      to:
        description: Last month (YYYY-MM)
        default: '2025-12'

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: anton-portfolio
    env:
      PORTFOLIO_RAW: ${{ github.workspace }}/warehouse/raw
      DIVA_FROM: ${{ inputs.from }}
      DIVA_TO: ${{ inputs.to }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up and restore harvested months
        id: setup
        uses: ./.github/actions/data-setup
        with:
          pull: diva
      - name: Harvest
        run: python platform/pipeline.py run diva --only ingest
      - name: Save harvested months
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: python platform/pipeline.py push diva
      - name: Cluster, validate and publish
        run: python platform/pipeline.py run diva --only export,publish
