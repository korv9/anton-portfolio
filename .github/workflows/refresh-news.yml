name: Refresh political news

# Each morning: read the SVT, Ekot and Government feeds, add new items to the news archive on
# R2 (the feeds hold only the last day or so, so the archive is built by reading daily),
# tag them by party and topic, and commit parliament/news.json when it changed. Cloudflare
# publishes the site from that commit (docs/deploy.md).

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The R2 credentials are secrets of the anton-portfolio environment.
    environment: anton-portfolio
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      PORTFOLIO_DB: ${{ github.workspace }}/warehouse/portfolio.duckdb
      PORTFOLIO_RAW: ${{ github.workspace }}/warehouse/raw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      # Without the bucket the archive cannot outlive the run, so there is nothing to do.
      - name: Require R2 credentials
        id: creds
        run: |
          if [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::warning::R2 secrets are not set; the news archive needs them (docs/deploy.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/requirements.txt
      - name: Fetch, tag and export
        if: steps.creds.outputs.ok == 'true'
        run: |
          pip install -r platform/requirements.txt
          python platform/ingest/news/news_ingest.py --sync --months 3
          python platform/ingest/news/people_ingest.py
          cd platform
          dbt build --profiles-dir . --select tag:news
          cd ..
          python platform/publish/export_news.py
      # The week's summary, written by Claude from the headlines and grounded in them. Runs only
      # when the ANTHROPIC_API_KEY secret is set; without it the page shows the headlines alone.
      - name: Summarise the week's news
        if: steps.creds.outputs.ok == 'true' && env.ANTHROPIC_API_KEY != ''
        run: |
          pip install anthropic
          python platform/publish/summarize_news.py --days 7
      - name: Commit the news when it changed
        if: steps.creds.outputs.ok == 'true'
        run: |
          git config user.name 'data-refresh[bot]'
          git config user.email 'data-refresh@users.noreply.github.com'
          # generated_at changes on every run; commit only when an item or a status did.
          if python -c "
          import json, subprocess, sys
          path = 'frontend/public/data/parliament/news.json'
          before = json.loads(subprocess.run(['git', 'show', 'HEAD:' + path], capture_output=True, text=True).stdout or '{}')
          after = json.load(open(path))
          for d in (before, after): d.pop('generated_at', None)
          sys.exit(0 if before == after else 1)"; then
            echo "No new news."
          else
            git add frontend/public/data/parliament/news.json frontend/public/data/parliament/news-summaries.json 2>/dev/null || git add frontend/public/data/parliament/news.json
            git commit -m "data: political news (run ${GITHUB_RUN_ID})"
            git pull --rebase origin main
            git push
          fi
