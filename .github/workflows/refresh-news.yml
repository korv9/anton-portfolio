name: Refresh political news

# Each morning, the news subject of platform/pipeline.yml: restore the last approved summary,
# read the SVT, Ekot and Government feeds, add new items to the news archive on R2 (the feeds
# hold only the last day or so, so the archive is built by reading daily), tag them by party and
# topic, then publish an independently versioned news group in R2. The optional summary may fail
# without blocking the headlines. No data commit is created.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false
  # Wait in order: the default keeps one pending run and cancels the one before it.
  queue: max

jobs:
  # The steps and the failure alert are in data-subject.yml. The R2 credentials are secrets of
  # the anton-portfolio environment, which only the called job enters, so they cannot be passed
  # by name from here. The token is limited to what the alert needs.
  refresh:
    uses: ./.github/workflows/data-subject.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      issues: write
    with:
      subjects: news
      timeout-minutes: 20
      summary: true
