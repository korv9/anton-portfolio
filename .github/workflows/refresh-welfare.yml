name: Refresh public data

# Daily: welfare (five sources), parliament (Riksdagen, SCB, Valmyndigheten) and taxes (OECD,
# Skatteverket), each fetched, built, tested and exported by platform/pipeline.py as
# platform/pipeline.yml defines them, then published as one validated, versioned group in R2.
# The run record (welfare/run.json) is written to R2 on every run, so the status page shows when
# the pipeline last checked, not only when data last moved. The site reads the active R2 release
# without a data commit or code deployment. docs/pipeline.md describes the whole flow.

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Refetch history and current data (source revisions)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false
  # Wait in order: the default keeps one pending run and cancels the one before it.
  queue: max

jobs:
  # The steps and the failure alert are in data-subject.yml. The R2 credentials are secrets of
  # the anton-portfolio environment, which only the called job enters, so they cannot be passed
  # by name from here. The token is limited to what the alert needs.
  refresh:
    uses: ./.github/workflows/data-subject.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      issues: write
    with:
      subjects: welfare parliament taxes
      store: welfare parliament taxes
      timeout-minutes: 240
      # 70, 90 and 60 minutes for the three sources; the store and the publication need the rest.
      build-timeout-minutes: 220
      full-refresh: ${{ inputs.full_refresh == true }}
