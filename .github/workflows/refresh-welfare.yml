name: Refresh public data

# Daily: welfare (five sources), parliament (Riksdagen, SCB, Valmyndigheten) and taxes (OECD,
# Skatteverket), each fetched, built, tested and exported by platform/pipeline.py as
# platform/pipeline.yml defines them, then published as one validated, versioned group in R2.
# The run record (welfare/run.json) is written to R2 on every run, so the status page shows when
# the pipeline last checked, not only when data last moved. The site reads the active R2 release
# without a data commit or code deployment. docs/pipeline.md describes the whole flow.

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Refetch history and current data (source revisions)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false
  # Wait in order: the default keeps one pending run and cancels the one before it.
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # The R2 credentials are secrets of the anton-portfolio environment.
    if: github.ref == 'refs/heads/main'
    environment: anton-portfolio
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      PORTFOLIO_FULL_REFRESH: ${{ inputs.full_refresh && '1' || '0' }}
      PORTFOLIO_DB: ${{ github.workspace }}/warehouse/portfolio.duckdb
      PORTFOLIO_RAW: ${{ github.workspace }}/warehouse/raw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # The bucket's public address once a custom domain is connected; empty keeps r2.dev.
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same writer lock as build-warehouse.yml: shared raw manifests and R2 keys.
      - name: Set up and restore verified raw files
        id: setup
        uses: ./.github/actions/data-setup
        with:
          pull: welfare parliament taxes
      - name: Fetch, build, test and export welfare
        id: welfare
        continue-on-error: true
        timeout-minutes: 70
        run: python platform/pipeline.py run welfare --only ingest,dbt,export
      - name: Save welfare checkpoints
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python platform/pipeline.py push welfare
      - name: Fetch, build, test and export parliament
        id: parliament
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 90
        run: python platform/pipeline.py run parliament --only ingest,dbt,export
      - name: Save parliament checkpoints
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python platform/pipeline.py push parliament
      - name: Fetch, build, test and export taxes
        id: taxes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 60
        run: python platform/pipeline.py run taxes --only ingest,dbt,export
      # Raw checkpoints are useful even if a later source or dbt test fails.
      - name: Save all available checkpoints
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: python platform/pipeline.py push welfare parliament taxes
      - name: Require successful subject builds
        if: ${{ !cancelled() }}
        env:
          WELFARE: ${{ steps.welfare.outcome }}
          PARLIAMENT: ${{ steps.parliament.outcome }}
          TAXES: ${{ steps.taxes.outcome }}
        run: |
          [ "$WELFARE" = success ] && [ "$PARLIAMENT" = success ] && [ "$TAXES" = success ]
      - name: Data contracts, then publish and verify the group in R2
        run: python platform/pipeline.py run welfare parliament taxes --only publish

  # A failed or timed-out run opens (or comments on) an issue; a successful one closes it.
  alert:
    needs: refresh
    if: ${{ !cancelled() && needs.refresh.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/failure-issue
        with:
          result: ${{ needs.refresh.result }}
