name: Refresh public data

# Daily: fetch the five welfare sources, the tax sources (OECD, Skatteverket) and the parliament sources (Riksdagen roll calls and
# government-formation news, SCB elections and party preference survey, Valmyndigheten),
# build and test the warehouse, export the site's JSON and the Parquet the browser filters,
# upload to R2, and commit the delivery files when they changed. The run record (welfare/run.json) is also written to R2 on every run,
# so the status page shows when the pipeline last checked, not only when data last moved.
# Current periods are checked daily; bulk OECD/FK responses have a seven-day refresh policy.
# Cloudflare builds and publishes the site from every push to main, this commit included
# (docs/deploy.md), so the workflow does not deploy itself.

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Refetch history and current data (source revisions)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # The R2 credentials are secrets of the anton-portfolio environment.
    environment: anton-portfolio
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      PORTFOLIO_FULL_REFRESH: ${{ inputs.full_refresh && '1' || '0' }}
      PORTFOLIO_DB: ${{ github.workspace }}/warehouse/portfolio.duckdb
      PORTFOLIO_RAW: ${{ github.workspace }}/warehouse/raw
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # The bucket's public address once a custom domain is connected; empty keeps r2.dev.
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
    steps:
      - name: Require R2 credentials
        run: |
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!name}" ] || { echo "::error::Secret $name is not set"; exit 1; }
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/requirements.txt
      - run: pip install -r platform/requirements.txt
      # Same writer lock as build-warehouse.yml: shared raw manifests and R2 keys.
      - name: Restore verified raw files
        id: restore
        run: >-
          python platform/publish/warehouse_store.py pull --only raw
          --path scb --path fohm --path fk --path ess --path kolada
          --path riksdagen/votes --path riksdagen/reports --path riksdagen/studies
          --path riksdagen/formation --path riksdagen/_checkpoints --path riksdagen/_manifest.jsonl --path val --path oecd --path skatteverket
      - name: Fetch, build and test welfare
        id: welfare
        continue-on-error: true
        timeout-minutes: 70
        run: python platform/ingest/run_welfare.py
      - name: Save welfare checkpoints
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: >-
          python platform/publish/warehouse_store.py push --only raw --prune
          --path scb --path fohm --path fk --path ess --path kolada
      - name: Fetch, build and test parliament
        id: parliament
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 90
        run: python platform/ingest/run_parliament.py
      - name: Save parliament checkpoints
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: >-
          python platform/publish/warehouse_store.py push --only raw --prune
          --path scb --path riksdagen/votes --path riksdagen/reports --path riksdagen/studies
          --path riksdagen/formation --path riksdagen/_checkpoints --path riksdagen/_manifest.jsonl --path val
      - name: Fetch, build and test taxes
        id: taxes
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 60
        run: python platform/ingest/run_taxes.py
      # Raw checkpoints are useful even if a later source or dbt test fails.
      - name: Save all available checkpoints
        if: ${{ always() && steps.restore.outcome == 'success' }}
        run: >-
          python platform/publish/warehouse_store.py push --only raw --prune
          --path scb --path fohm --path fk --path ess --path kolada
          --path riksdagen/votes --path riksdagen/reports --path riksdagen/studies
          --path riksdagen/formation --path riksdagen/_checkpoints --path riksdagen/_manifest.jsonl --path val --path oecd --path skatteverket
      - name: Require successful subject builds
        if: ${{ !cancelled() }}
        env:
          WELFARE: ${{ steps.welfare.outcome }}
          PARLIAMENT: ${{ steps.parliament.outcome }}
          TAXES: ${{ steps.taxes.outcome }}
        run: |
          [ "$WELFARE" = success ] && [ "$PARLIAMENT" = success ] && [ "$TAXES" = success ]
      - name: Export delivery files
        run: |
          python platform/publish/export_welfare.py
          python platform/publish/export_parliament.py
          python platform/publish/export_taxes.py
          python platform/publish/export_schema.py
      - name: Data contracts before publishing
        run: |
          npm run data:catalog
          npm run data:check
          python platform/publish/validate_public_data.py
      - name: Upload to R2 and verify
        run: |
          python platform/publish/upload.py
          python platform/publish/upload.py --verify-only --offload
          npm run data:catalog
      - name: Publish the run record
        run: python platform/publish/publish_status.py
      - name: Commit changed delivery files
        id: commit
        run: |
          git config user.name 'data-refresh[bot]'
          git config user.email 'data-refresh@users.noreply.github.com'
          git add frontend/public/data
          # run.json changes on every run; commit only when something else did.
          if git diff --cached --quiet -- . ':(exclude)frontend/public/data/welfare/run.json' \
               ':(exclude)frontend/public/data/catalog.json' ':(exclude)frontend/public/data/delivery.json'; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh public sources (run ${GITHUB_RUN_ID})"
            # main may have moved during the run (a merge, another refresh): put this commit on
            # top of it and push, a few times if needed.
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 15))
            done
            "$pushed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
