name: CI

# Every main push and pull request: the site builds and passes its browser tests, and the
# platform's tests, data contracts and dbt project are valid. Fetching and building the
# welfare warehouse from live APIs is the scheduled pipeline's job, not every push's.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Site (format, types, build, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      # The same config Cloudflare deploys from: fails here, not in production, if
      # wrangler.toml or the built assets would not deploy.
      - name: Cloudflare deploy config (dry run)
        run: npx --no-install wrangler deploy --dry-run
      # ponytail: the runner image already carries Chromium's system libraries, so
      # skip --with-deps; its apt step took 9-14 min on 3 of 8 recent runs.
      # Add --with-deps back if a launch fails on a missing library.
      - name: Install Chromium
        run: npx playwright install chromium
      - run: npm run test:security:built
      - run: npm run test:e2e
        env:
          CI: 'true'
      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  platform:
    name: Platform (tests, data contracts, dbt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      # An empty warehouse: dbt must parse and compile without any fetched data.
      PORTFOLIO_DB: ${{ github.workspace }}/warehouse/ci.duckdb
      PORTFOLIO_RAW: ${{ github.workspace }}/warehouse/raw
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/requirements-ci.lock
      - run: pip install --require-hashes -r platform/requirements-ci.lock
      # Cross-language compliance reconciliation runs the same TypeScript transform as the UI.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: python -m pytest platform/tests -q
      # Every subject in platform/pipeline.yml resolves to commands whose files exist.
      - name: Pipeline registry (dry run of every subject)
        run: python platform/pipeline.py run --all --dry-run
      - name: Data contracts (gold, budget, products, politics)
        run: npm run data:check
      - name: dbt parse and compile
        working-directory: platform
        run: |
          mkdir -p "$PORTFOLIO_RAW"
          dbt parse --profiles-dir .
          dbt compile --profiles-dir .
          python publish/validate_semantic_layer.py
      # Politics subjects that have left legacy/ build from committed deliveries, so CI can
      # rebuild them and prove the output is byte-identical to what the site serves.
      - name: Politics in dbt, reconciled with the delivery
        run: npm run politics:check
