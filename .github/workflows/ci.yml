name: CI

# Every push and pull request: the site builds and passes its browser tests, and the
# platform's tests, data contracts and dbt project are valid. Fetching and building the
# welfare warehouse from live APIs is the scheduled pipeline's job, not every push's.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Site (format, types, build, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  platform:
    name: Platform (tests, data contracts, dbt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      # An empty warehouse: dbt must parse and compile without any fetched data.
      PORTFOLIO_DB: ${{ github.workspace }}/warehouse/ci.duckdb
      PORTFOLIO_RAW: ${{ github.workspace }}/warehouse/raw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/requirements.txt
      - run: pip install -r platform/requirements.txt
      - run: python -m pytest platform/tests -q
      - name: Data contracts (gold, budget, products, politics)
        run: npm run data:check
      - name: dbt parse and compile
        working-directory: platform
        run: |
          mkdir -p "$PORTFOLIO_RAW"
          dbt parse --profiles-dir .
          dbt compile --profiles-dir .
