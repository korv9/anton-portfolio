name: Data setup
description: >-
  Checks the R2 credentials, installs Python and the platform's requirements, and restores the
  stored raw and feature files of the named subjects. Run actions/checkout first: a local action
  is read from the checkout. The job's env must carry the four R2 values.

inputs:
  pull:
    description: Subjects to restore from R2 (platform/pipeline.yml), or --all. Empty restores nothing.
    default: ''
  ml:
    description: Install the ML dependencies (CPU PyTorch, sentence-transformers, UMAP)
    default: 'false'

runs:
  using: composite
  steps:
    # Without the bucket nothing outlives the run, so stop before any fetch.
    - name: Require R2 credentials
      shell: bash
      run: |
        for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
          value="${!name}"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          export "$name=$value"
          if [ -z "${!name}" ]; then echo "::error::$name is not set (docs/platform/deploy.md)"; exit 1; fi
        done
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: platform/requirements-ci.lock
    - shell: bash
      run: pip install --require-hashes -r platform/requirements-ci.lock
    - name: ML dependencies
      if: inputs.ml == 'true'
      shell: bash
      run: |
        pip install --require-hashes -r platform/requirements-ml.lock
    # The platform package (pyproject.toml); its dependencies are the locks above.
    - name: Platform package
      shell: bash
      run: pip install --no-deps --no-build-isolation -e .
    - name: Restore stored raw and feature files
      if: inputs.pull != ''
      shell: bash
      env:
        SUBJECTS: ${{ inputs.pull }}
      # Unquoted on purpose: one argument per subject.
      run: python platform/pipeline.py pull $SUBJECTS
