name: Failure issue
description: >-
  Opens a GitHub issue labelled data-pipeline-failure when a data workflow's job failed, or
  comments on the one already open for that workflow, naming the run and its failed steps. A
  later successful run closes it. Run in its own job after the data job, with issues: write and
  actions: read, and actions/checkout first: a local action is read from the checkout.

inputs:
  result:
    description: The data job's result (needs.<job>.result); cancelled here means it timed out
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RESULT: ${{ inputs.result }}
        TITLE: 'Data pipeline failed: ${{ github.workflow }}'
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        label=data-pipeline-failure
        open=$(gh issue list --label "$label" --state open --limit 100 --json number,title \
          --jq 'map(select(.title == $ENV.TITLE)) | .[0].number // empty')
        if [ "$RESULT" = success ]; then
          if [ -n "$open" ]; then gh issue close "$open" --comment "Succeeded again: $RUN_URL"; fi
          exit 0
        fi
        [ "$RESULT" = failure ] || [ "$RESULT" = cancelled ] || exit 0
        failed=$(gh run view "$GITHUB_RUN_ID" --json jobs --jq '.jobs[]
          | select(.conclusion == "failure" or .conclusion == "cancelled")
          | "- \(.name): \([.steps[] | select(.conclusion == "failure") | .name] | join(", "))"')
        body=$(printf 'Workflow: %s\nRun: %s (attempt %s, %s)\nResult: %s\n\nFailed jobs and steps:\n%s\n' \
          "$GITHUB_WORKFLOW" "$RUN_URL" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" "$RESULT" "${failed:-unknown}")
        if [ -n "$open" ]; then
          gh issue comment "$open" --body "$body"
        else
          gh label create "$label" --color B60205 --description "A scheduled data workflow failed" --force
          gh issue create --title "$TITLE" --label "$label" --body "$body"
        fi
